<script>


let allOrders = [];

let dateFilter = "all";

let currentPage = "orders";


// =========================
// 登录
// =========================

async function login() {

const username =
document
.getElementById(
"username"
)
.value
.trim();


const password =
document
.getElementById(
"password"
)
.value;


const loginError =
document
.getElementById(
"loginError"
);


loginError.textContent =
"";


try {

const response =
await fetch(
"/api/admin/login",
{
method:
"POST",

headers: {
"Content-Type":
"application/json"
},

body:
JSON.stringify({
username,
password
})
}
);


const data =
await response.json();


if (
!data.success
) {

loginError.textContent =
data.message ||
"账号或密码错误";

return;

}


localStorage.setItem(
"adminToken",
data.token
);


showAdminPage();


loadOrders();


} catch (
error
) {

console.error(
error
);


loginError.textContent =
"登录失败，请检查网络";

}

}


// =========================
// 显示后台
// =========================

function showAdminPage() {

document
.getElementById(
"loginPage"
)
.style.display =
"none";


document
.getElementById(
"adminPage"
)
.style.display =
"block";

}


// =========================
// 退出
// =========================

function logout() {

localStorage.removeItem(
"adminToken"
);


document
.getElementById(
"adminPage"
)
.style.display =
"none";


document
.getElementById(
"loginPage"
)
.style.display =
"flex";

}


// =========================
// 切换页面
// =========================

function switchPage(
page
) {

currentPage =
page;


document
.querySelectorAll(
".admin-section"
)

// =========================
// 加载订单
// =========================

async function loadOrders() {

const loading =
document.getElementById(
"loading"
);


const empty =
document.getElementById(
"empty"
);


const tableWrap =
document.getElementById(
"tableWrap"
);


const token =
getToken();


if (
!token
) {

logout();

return;

}


loading.style.display =
"block";


empty.style.display =
"none";


tableWrap.style.display =
"none";


try {

const response =
await fetch(
"/api/orders",
{
headers: {
"Authorization":
"Bearer " +
token
}
}
);


if (
response.status === 401
) {

logout();

return;

}


const data =
await response.json();


if (
!data.success
) {

throw new Error(
data.message ||
"获取订单失败"
);

}


allOrders =
data.orders ||
[];


updateStats();


filterOrders();


loading.style.display =
"none";


} catch (
error
) {

console.error(
error
);


loading.textContent =
"订单加载失败，请刷新重试";

}

}


// =========================
// 统计
// =========================

function updateStats() {

document
.getElementById(
"totalOrders"
)
.textContent =
allOrders.length;


document
.getElementById(
"pendingOrders"
)
.textContent =
allOrders.filter(
order =>
order.status ===
"待确认"
)
.length;


const today =
new Date()
.toISOString()
.slice(
0,
10
);


document
.getElementById(
"todayOrders"
)
.textContent =
allOrders.filter(
order =>
order.date ===
today
)
.length;


document
.getElementById(
"completedOrders"
)
.textContent =
allOrders.filter(
order =>
order.status ===
"已完成"
)
.length;

}


// =========================

// =========================

function setDateFilter(
type,
button
) {

document

// =========================
// 搜索筛选
// =========================

function filterOrders() {

const keyword =
document
.getElementById(
"searchInput"
)
.value
.trim()
.toLowerCase();


const status =
document
.getElementById(
"statusFilter"
)
.value;


const today =
new Date();


const todayString =
today
.toISOString()
.slice(
0,
10
);


const tomorrow =
new Date(
today
);


tomorrow.setDate(
today.getDate() +
1
);


const tomorrowString =
tomorrow
.toISOString()
.slice(
0,
10
);


const filtered =
allOrders.filter(
order => {

const keywordMatch =
!keyword ||

String(
order.id ||
""
)
.toLowerCase()
.includes(
keyword
) ||

String(
order.name ||
""
)
.toLowerCase()
.includes(
keyword
) ||

String(
order.phone ||
""
)
.includes(
keyword
);


const statusMatch =
!status ||
order.status ===
status;


let dateMatch =
true;


if (
dateFilter ===
"today"
) {

dateMatch =
order.date ===
todayString;

}


if (
dateFilter ===
"tomorrow"
) {

dateMatch =
order.date ===
tomorrowString;

}


return (
keywordMatch &&
statusMatch &&
dateMatch
);

}
);


renderOrders(
filtered
);

}

// 渲染订单

function renderOrders(
orders
) {

document.getElementById(

);

);

document.getElementById(

);

"";

) {

"none";

"none";


tableWrap.style.display =
"block";

);

)

];

"";

status

: "";

status +
"\"" +
selected +
">" +
status +

);


row.innerHTML =

) +

"-"
) +
"</td>" +

String(
order.price ||
0
)
) +
"</td>" +

"-"
) +
"</td>" +

"<td>" +
escapeHtml(
order.therapist ||
"-"
) +

order.date ||
"-"
) +
"<br>" +
escapeHtml(
order.time ||
"-"
) +

order.name ||
"-"
) +

escapeHtml(
order.phone ||
"-"
) +
"</td>" +

escapeHtml(
order.address ||
"-"
) +
"</td>" +

"<td>" +

"<select " +

"class=\"status-select\" " +

">" +

options +

escapeHtml(
createdAt
) +
"</td>" +

"<td>" +

"class=\"delete-btn\"" +

const statusSelect =
row.querySelector(
".status-select"
);


statusSelect.addEventListener(

function() {

updateOrderStatus(
order.id,
statusSelect.value

);

row.querySelector(
".delete-btn"
);

"click",

deleteOrder(
order.id
);

);


ordersBody.appendChild(
row
);

}
);

}

async function updateOrderStatus(
orderId,
status
) {

getToken();


try {

const response =
await fetch(
"/api/orders/" +
encodeURIComponent(
orderId
) +
"/status",
{
method:
"PATCH",

headers: {

"Content-Type":
"application/json",

"Authorization":
"Bearer " +
token

},

body:
JSON.stringify({
status
})

}
);


const data =
await response.json();


if (
response.status ===
401
) {

}

!data.success
) {

);

} catch (
error
) {

);

// =========================
// 加载疗愈师
// =========================

async function loadTherapists() {

const loading =
document.getElementById(
"therapistLoading"
);


const grid =
document.getElementById(
"therapistGrid"
);


loading.style.display =
"block";


grid.innerHTML =
"";


const token =
getToken();


try {

const response =
await fetch(
"/api/admin/therapists",
{
headers: {

"Authorization":
"Bearer " +
token

}
}
);


if (
response.status ===
401
) {

logout();

return;

}


const data =
await response.json();


const therapists =
Array.isArray(
data
)
? data
: (
data.therapists ||
[]
);


loading.style.display =
"none";


if (
therapists.length ===
0
) {

grid.innerHTML =
"<div class=\"empty\">暂时还没有疗愈师，请点击右上角添加。</div>";

return;

}


therapists.forEach(
therapist => {

const card =
document.createElement(
"div"
);


card.className =
"therapist-card";


const image =
therapist.image ||
therapist.avatar ||
"";


const specialties =
therapist.specialty ||
therapist.specialties ||
"";


let tags =
[];


if (
Array.isArray(
specialties
)
) {

tags =
specialties;

} else {

tags =
String(
specialties
)
.split(
/[,，、]/
)
.map(
item =>
item.trim()
)
.filter(
Boolean
);

}


let tagsHtml =
"";


tags.forEach(
tag => {

tagsHtml +=
"<span class=\"tag\">" +
escapeHtml(
tag
) +
"</span>";

}
);


const active =
therapist.active ===
false
? false
: (
therapist.is_active ===
false
? false
: true
);


card.innerHTML =

image
? "<img class=\"therapist-image\" src=\"" +
escapeHtml(
image
) +
"\">"
: "<div class=\"therapist-image\"></div>" +

"<div class=\"therapist-content\">" +

"<div class=\"therapist-name\">" +
escapeHtml(
therapist.name ||
"未命名"
) +
"</div>" +

"<div class=\"therapist-meta\">" +
escapeHtml(
therapist.experience ||
therapist.years ||
""
) +
"</div>" +

"<div class=\"therapist-desc\">" +
escapeHtml(
therapist.intro ||
therapist.description ||
"暂无简介"
) +
"</div>" +

"<div class=\"therapist-tags\">" +
tagsHtml +
"</div>" +

"<div class=\"" +
(
active
? "status-badge status-active"
: "status-badge status-inactive"
) +
"\">" +
(
active
? "● 可预约"
: "● 暂停预约"
) +
"</div>" +

"<div class=\"therapist-actions\">" +

"<button class=\"edit-btn\">编辑资料</button>" +

"<button class=\"card-delete-btn\">删除</button>" +

"</div>" +

"</div>";


const editBtn =
card.querySelector(
".edit-btn"
);


editBtn.addEventListener(
"click",
function() {

openTherapistModal(
therapist
);

}
);


const deleteBtn =
card.querySelector(
".card-delete-btn"
);


deleteBtn.addEventListener(
"click",
function() {

deleteTherapist(
therapist.id
);

}
);


grid.appendChild(
card
);

}
);


} catch (
error
) {

console.error(
error
);


loading.textContent =
"疗愈师加载失败，请刷新重试";

}

}

// =========================
// 保存疗愈师
// =========================

async function saveTherapist() {

const id =
document
.getElementById(
"therapistEditId"
)
.value;


const name =
document
.getElementById(
"therapistName"
)
.value
.trim();


const image =
document
.getElementById(
"therapistImage"
)
.value
.trim();


const intro =
document
.getElementById(
"therapistIntro"
)
.value
.trim();


const experience =
document
.getElementById(
"therapistExperience"
)
.value
.trim();


const specialty =
document
.getElementById(
"therapistSpecialty"
)
.value
.trim();


const active =
document
.getElementById(
"therapistActive"
)
.value ===
"true";


if (
!name
) {

alert(
"请输入疗愈师姓名"
);

return;

}


const payload = {

name,
image,
intro,
experience,
specialty,
active

};


const token =
getToken();


try {

let url =
"/api/admin/therapists";


let method =
"POST";


if (
id
) {

url =
"/api/admin/therapists/" +
encodeURIComponent(
id
);


method =
"PUT";

}


const response =
await fetch(
url,
{
method,

headers: {

"Content-Type":
"application/json",

"Authorization":
"Bearer " +
token

},

body:
JSON.stringify(
payload
)

}
);


const data =
await response.json();


if (
!response.ok ||
data.success === false
) {

throw new Error(
data.message ||
"保存失败"
);

}


closeTherapistModal();


loadTherapists();


alert(
"疗愈师资料已保存"
);


} catch (
error
) {

console.error(
error
);


alert(
error.message ||
"保存失败"
);

}

}
