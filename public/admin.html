\<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

\<input
id="username"
class="login-input"
placeholder="管理员账号"

>

\<input
id="password"
class="login-input"
type="password"
placeholder="管理员密码"

>

\<button
class="login-btn"
onclick="login()"

>

登录后台


\<button
class="header-btn refresh-btn"
onclick="refreshCurrentPage()"

>

刷新


\<button
class="header-btn logout-btn"
onclick="logout()"

>

退出登录


\<button
class="nav-btn active"
onclick="switchPage('orders')"
id="ordersNav"

>

订单管理


\<button
class="nav-btn"
onclick="switchPage('therapists')"
id="therapistsNav"

>

疗愈师管理


\<input
id="searchInput"
class="search-input"
placeholder="搜索订单号、姓名、手机号"
oninput="filterOrders()"

>

\<select
id="statusFilter"
class="filter-select"
onchange="filterOrders()"

>

\<button
class="quick-btn active"
onclick="setDateFilter('all', this)"

>

全部


\<button
class="quick-btn"
onclick="setDateFilter('today', this)"

>

今天


\<button
class="quick-btn"
onclick="setDateFilter('tomorrow', this)"

>

明天


\<button
class="add-btn"
onclick="openTherapistModal()"

>

＋ 添加疗愈师


\<input
id="therapistEditId"
type="hidden"

>

\<input
id="therapistName"
class="form-input"
placeholder="例如：安然"

>

\<input
id="therapistImage"
class="form-input"
placeholder="例如：https\://..."

>

\<input
id="therapistExperience"
class="form-input"
placeholder="例如：6年疗愈服务经验"

>

\<input
id="therapistSpecialty"
class="form-input"
placeholder="例如：深度放松、肩颈舒缓、身心疗愈"

>

\<select
id="therapistActive"
class="form-select"

>

\<button
class="cancel-btn"
onclick="closeTherapistModal()"

>

取消


\<button
class="save-btn"
onclick="saveTherapist()"

>

保存疗愈师
