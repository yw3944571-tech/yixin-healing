  id="username"
  class="login-input"
  placeholder="管理员账号"
  autocomplete="username"
>

  id="password"
  class="login-input"
  type="password"
  placeholder="管理员密码"
  autocomplete="current-password"
>

<button
  id="loginBtn"
  class="login-btn"
  onclick="login()"
>
  登录后台
</button>

<div
  id="loginError"
  class="login-error"
></div>

```
<input
  id="searchInput"
  class="search-input"
  placeholder="搜索订单号、姓名、手机号"
  oninput="filterOrders()"
>

<select
  id="statusFilter"
  class="filter-select"
  onchange="filterOrders()"
>

  <option value="">全部状态</option>
  <option value="待确认">待确认</option>
  <option value="已确认">已确认</option>
  <option value="服务中">服务中</option>
  <option value="已完成">已完成</option>
  <option value="已取消">已取消</option>

</select>

<button
  class="quick-btn active"
  onclick="setDateFilter('all',this)"
>
  全部
</button>

<button
  class="quick-btn"
  onclick="setDateFilter('today',this)"
>
  今天
</button>

<button
  class="quick-btn"
  onclick="setDateFilter('tomorrow',this)"
>
  明天
</button>

```

    疗愈师管理
  </h2>

  <div
    style="
      margin-top:6px;
      font-size:13px;

    "

```
<h2
  id="therapistModalTitle"
  class="modal-title"
>
  添加疗愈师
</h2>


<input
  id="therapistEditId"
  type="hidden"
>


<div class="form-group">

  <label class="form-label">
    疗愈师姓名
  </label>

  <input
    id="therapistName"
    class="form-input"
    placeholder="例如：安然"
  >

</div>


<div class="form-group">

  <label class="form-label">
    头像图片地址
  </label>

  <input
    id="therapistAvatar"
    class="form-input"
    placeholder="例如：https://..."
  >

</div>


<div class="form-group">

  <label class="form-label">
    个人简介
  </label>

  <textarea
    id="therapistBio"
    class="form-textarea"
    placeholder="介绍疗愈师的风格、理念和特点"
  ></textarea>

</div>


<div class="form-group">

  <label class="form-label">
    从业经验
  </label>

  <input
    id="therapistExperience"
    class="form-input"
    placeholder="例如：6年疗愈服务经验"
  >

</div>


<div class="form-group">

  <label class="form-label">
    擅长项目
  </label>

  <input
    id="therapistSpecialties"
    class="form-input"
    placeholder="例如：深度放松、肩颈舒缓、身心疗愈"
  >

</div>


<div class="form-group">

  <label class="form-label">
    服务状态
  </label>

  <select
    id="therapistIsActive"
    class="form-select"
  >

    <option value="true">
      上架 / 可预约
    </option>

    <option value="false">
      下架 / 暂不可预约
    </option>

  </select>

</div>


<div class="modal-actions">

  <button
    class="cancel-btn"
    onclick="closeTherapistModal()"
  >
    取消
  </button>

  <button
    id="saveTherapistBtn"
    class="save-btn"
    onclick="saveTherapist()"
  >
    保存疗愈师
  </button>

</div>

```
