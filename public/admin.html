<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>奕心疗愈舍｜管理后台</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  background: #f6f5f2;
  color: #222;
}

button,
input,
select {
  font-family: inherit;
}

/* =========================
   登录
========================= */

.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: #fff;
  padding: 42px 35px;
  border-radius: 18px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.08);
}

.logo {
  text-align: center;
  font-size: 27px;
  font-weight: 600;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.logo-sub {
  text-align: center;
  color: #999;
  font-size: 13px;
  margin-bottom: 35px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #555;
}

.form-group input {
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.form-group input:focus {
  border-color: #222;
}

.login-btn {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: #fff;
  font-size: 15px;
  cursor: pointer;
}

.login-btn:hover {
  background: #000;
}

.login-message {
  text-align: center;
  color: #d33;
  font-size: 13px;
  margin-top: 15px;
  min-height: 20px;
}

/* =========================
   后台
========================= */

.admin-page {
  display: none;
  min-height: 100vh;
}

/* =========================
   顶部
========================= */

.header {
  height: 72px;
  background: #fff;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 18px;
}

.header-title {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 2px;
}

.header-sub {
  font-size: 13px;
  color: #999;
}

.logout-btn {
  border: 1px solid #ddd;
  background: #fff;
  padding: 8px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13px;
}

.logout-btn:hover {
  background: #f5f5f5;
}

/* =========================
   导航
========================= */

.nav {
  background: #fff;
  border-bottom: 1px solid #eee;
  padding: 0 30px;
  display: flex;
  gap: 30px;
}

.nav-btn {
  border: none;
  background: transparent;
  padding: 17px 4px;
  font-size: 14px;
  color: #888;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.nav-btn.active {
  color: #222;
  border-bottom-color: #222;
  font-weight: 600;
}

/* =========================
   主体
========================= */

.container {
  max-width: 1500px;
  margin: 0 auto;
  padding: 28px;
}

.page-section {
  display: none;
}

.page-section.active {
  display: block;
}

/* =========================
   数据统计
========================= */

.stats {
  display: grid;
  grid-template-columns:
    repeat(7, minmax(0, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.stat-card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  border: 1px solid #eee;
}

.stat-title {
  color: #999;
  font-size: 13px;
  margin-bottom: 10px;
}

.stat-number {
  font-size: 28px;
  font-weight: 600;
}

.stat-card.today {
  background: #222;
  color: #fff;
}

.stat-card.today .stat-title {
  color: #ccc;
}

/* =========================
   工具栏
========================= */

.toolbar {
  background: #fff;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  border: 1px solid #eee;
}

.search-input {
  height: 42px;
  width: 280px;
  padding: 0 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
}

.search-input:focus {
  border-color: #222;
}

.status-select {
  height: 42px;
  padding: 0 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  font-size: 14px;
  cursor: pointer;
}

.quick-btn {
  height: 42px;
  padding: 0 16px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.quick-btn:hover {
  background: #f5f5f5;
}

.quick-btn.active {
  background: #222;
  color: #fff;
  border-color: #222;
}

/* =========================
   表格
========================= */

.table-box {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #eee;
  overflow: hidden;
}

.table-scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1100px;
}

thead {
  background: #fafafa;
}

th {
  text-align: left;
  padding: 15px 13px;
  font-size: 13px;
  color: #666;
  font-weight: 500;
  border-bottom: 1px solid #eee;
  white-space: nowrap;
}

td {
  padding: 15px 13px;
  font-size: 13px;
  border-bottom: 1px solid #f1f1f1;
  vertical-align: middle;
}

tbody tr:hover {
  background: #fcfcfc;
}

.order-id {
  font-size: 12px;
  color: #777;
}

.price {
  font-weight: 600;
}

.customer-name {
  font-weight: 500;
}

.phone {
  white-space: nowrap;
}

.address {
  max-width: 220px;
  line-height: 1.5;
}

.order-status {
  min-width: 95px;
}

/* =========================
   删除
========================= */

.delete-btn {
  border: 1px solid #e1e1e1;
  background: #fff;
  color: #d33;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}

.delete-btn:hover {
  background: #fff5f5;
}

/* =========================
   疗愈师管理
========================= */

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.section-title {
  font-size: 20px;
  font-weight: 600;
}

.section-desc {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

.add-box {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.add-form {
  display: flex;
  gap: 10px;
  align-items: center;
}

.add-input {
  height: 44px;
  width: 280px;
  padding: 0 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  outline: none;
  font-size: 14px;
}

.add-input:focus {
  border-color: #222;
}

.add-btn {
  height: 44px;
  padding: 0 20px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: #fff;
  cursor: pointer;
  font-size: 14px;
}

.add-btn:hover {
  background: #000;
}

.therapist-table {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #eee;
  overflow: hidden;
}

.therapist-table table {
  min-width: 700px;
}

.active-badge {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
}

.active-badge.on {
  background: #edf8f1;
  color: #27814d;
}

.active-badge.off {
  background: #f3f3f3;
  color: #999;
}

.toggle-btn {
  border: 1px solid #ddd;
  background: #fff;
  padding: 7px 13px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
}

.toggle-btn:hover {
  background: #f5f5f5;
}

/* =========================
   空状态
========================= */

.empty {
  text-align: center;
  padding: 70px 20px;
  color: #aaa;
  font-size: 14px;
}

.loading {
  text-align: center;
  padding: 60px;
  color: #999;
}

/* =========================
   Toast
========================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 35px;
  transform: translateX(-50%);
  background: #222;
  color: #fff;
  padding: 12px 22px;
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 9999;
}

.toast.show {
  opacity: 1;
}

/* =========================
   手机端
========================= */

@media (max-width: 1100px) {

  .stats {
    grid-template-columns:
      repeat(4, 1fr);
  }

}

@media (max-width: 700px) {

  .header {
    height: auto;
    min-height: 68px;
    padding: 15px;
  }

  .header-title {
    font-size: 17px;
  }

  .header-sub {
    display: none;
  }

  .nav {
    padding: 0 15px;
    gap: 22px;
  }

  .container {
    padding: 15px;
  }

  .stats {
    grid-template-columns:
      repeat(2, 1fr);
    gap: 10px;
  }

  .stat-card {
    padding: 15px;
  }

  .stat-number {
    font-size: 23px;
  }

  .toolbar {
    padding: 13px;
  }

  .search-input {
    width: 100%;
  }

  .quick-btn {
    flex: 1;
    min-width: 90px;
  }

  .add-form {
    flex-direction: column;
    align-items: stretch;
  }

  .add-input {
    width: 100%;
  }

  .login-box {
    padding: 32px 22px;
  }

}

</style>

</head>

<body>


<!-- =========================
     登录页面
========================= -->

<div
  id="loginPage"
  class="login-page"
>

  <div class="login-box">

    <div class="logo">
      奕心疗愈舍
    </div>

    <div class="logo-sub">
      预约订单管理后台
    </div>

    <div class="form-group">

      <label>
        管理员账号
      </label>

      <input
        id="username"
        type="text"
        placeholder="请输入管理员账号"
        autocomplete="username"
      >

    </div>

    <div class="form-group">

      <label>
        管理员密码
      </label>

      <input
        id="password"
        type="password"
        placeholder="请输入管理员密码"
        autocomplete="current-password"
      >

    </div>

    <button
      class="login-btn"
      onclick="login()"
    >
      登录后台
    </button>

    <div
      id="loginMessage"
      class="login-message"
    ></div>

  </div>

</div>


<!-- =========================
     后台
========================= -->

<div
  id="adminPage"
  class="admin-page"
>


  <!-- 顶部 -->

  <div class="header">

    <div class="header-left">

      <div class="header-title">
        奕心疗愈舍
      </div>

      <div class="header-sub">
        预约订单管理后台
      </div>

    </div>

    <button
      class="logout-btn"
      onclick="logout()"
    >
      退出登录
    </button>

  </div>


  <!-- =========================
       导航
  ========================= -->

  <div class="nav">

    <button
      id="ordersNav"
      class="nav-btn active"
      onclick="showSection('orders')"
    >
      订单管理
    </button>

    <button
      id="therapistsNav"
      class="nav-btn"
      onclick="showSection('therapists')"
    >
      疗愈师管理
    </button>

  </div>


  <div class="container">


    <!-- =========================
         订单管理
    ========================= -->

    <section
      id="ordersSection"
      class="page-section active"
    >


      <!-- 统计 -->

      <div class="stats">

        <div class="stat-card">

          <div class="stat-title">
            总订单
          </div>

          <div
            id="totalCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-title">
            待确认
          </div>

          <div
            id="waitingCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-title">
            已确认
          </div>

          <div
            id="confirmedCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-title">
            服务中
          </div>

          <div
            id="workingCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-title">
            已完成
          </div>

          <div
            id="finishedCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card today">

          <div class="stat-title">
            今日订单
          </div>

          <div
            id="todayCount"
            class="stat-number"
          >
            0
          </div>

        </div>


        <div class="stat-card today">

          <div class="stat-title">
            今日营业额
          </div>

          <div
            id="todayRevenue"
            class="stat-number"
          >
            ¥0
          </div>

        </div>

      </div>


      <!-- 工具栏 -->

      <div class="toolbar">

        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="搜索订单号 / 姓名 / 手机号"
          oninput="renderOrders()"
        >


        <select
          id="statusFilter"
          class="status-select"
          onchange="renderOrders()"
        >

          <option value="">
            全部状态
          </option>

          <option value="待确认">
            待确认
          </option>

          <option value="已确认">
            已确认
          </option>

          <option value="服务中">
            服务中
          </option>

          <option value="已完成">
            已完成
          </option>

          <option value="已取消">
            已取消
          </option>

        </select>


        <button
          id="allBtn"
          class="quick-btn active"
          onclick="setDateFilter('')"
        >
          全部订单
        </button>


        <button
          id="todayBtn"
          class="quick-btn"
          onclick="setDateFilter('today')"
        >
          今天订单
        </button>


        <button
          id="tomorrowBtn"
          class="quick-btn"
          onclick="setDateFilter('tomorrow')"
        >
          明天订单
        </button>

      </div>


      <div
        id="filterInfo"
        class="filter-info"
      ></div>


      <!-- 订单表格 -->

      <div class="table-box">

        <div class="table-scroll">

          <table>

            <thead>

              <tr>

                <th>
                  订单号
                </th>

                <th>
                  服务
                </th>

                <th>
                  价格
                </th>

                <th>
                  时长
                </th>

                <th>
                  疗愈师
                </th>

                <th>
                  预约时间
                </th>

                <th>
                  客户
                </th>

                <th>
                  手机号
                </th>

                <th>
                  服务地址
                </th>

                <th>
                  状态
                </th>

                <th>
                  下单时间
                </th>

                <th>
                  操作
                </th>

              </tr>

            </thead>

            <tbody
              id="orderTableBody"
            >

              <tr>

                <td
                  colspan="12"
                  class="loading"
                >
                  正在加载订单...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- =========================
         疗愈师管理
    ========================= -->

    <section
      id="therapistsSection"
      class="page-section"
    >

      <div class="section-header">

        <div>

          <div class="section-title">
            疗愈师管理
          </div>

          <div class="section-desc">
            管理当前可提供预约服务的疗愈师
          </div>

        </div>

      </div>


      <!-- 添加疗愈师 -->

      <div class="add-box">

        <div class="section-title">
          添加疗愈师
        </div>

        <div
          class="section-desc"
          style="margin-bottom:15px;"
        >
          添加后，疗愈师默认处于“在岗”状态
        </div>


        <div class="add-form">

          <input
            id="therapistName"
            class="add-input"
            type="text"
            placeholder="请输入疗愈师姓名"
          >


          <button
            class="add-btn"
            onclick="addTherapist()"
          >
            ＋ 添加疗愈师
          </button>

        </div>

      </div>


      <!-- 疗愈师列表 -->

      <div class="therapist-table">

        <div class="table-scroll">

          <table>

            <thead>

              <tr>

                <th>
                  编号
                </th>

                <th>
                  疗愈师
                </th>

                <th>
                  当前状态
                </th>

                <th>
                  添加时间
                </th>

                <th>
                  操作
                </th>

              </tr>

            </thead>


            <tbody
              id="therapistTableBody"
            >

              <tr>

                <td
                  colspan="5"
                  class="loading"
                >
                  正在加载疗愈师...
                </td>

              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </section>

  </div>

</div>


<!-- Toast -->

<div
  id="toast"
  class="toast"
></div>


<script>

/* =========================
   全局变量
========================= */

let token =
  localStorage.getItem(
    "adminToken"
  );

let orders = [];

let therapists = [];

let dateFilter = "";

let toastTimer = null;


/* =========================
   页面初始化
========================= */

window.addEventListener(
  "load",
  function() {

    if (token) {

      showAdminPage();

    }

  }
);


/* =========================
   登录
========================= */

async function login() {

  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value;


  const message =
    document.getElementById(
      "loginMessage"
    );


  if (!username) {

    message.textContent =
      "请输入管理员账号";

    return;

  }


  if (!password) {

    message.textContent =
      "请输入管理员密码";

    return;

  }


  message.textContent =
    "正在登录...";


  try {

    const response =
      await fetch(
        "/api/admin/login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      message.textContent =
        data.message ||
        "登录失败";

      return;

    }


    token =
      data.token;


    localStorage.setItem(
      "adminToken",
      token
    );


    message.textContent =
      "";


    showAdminPage();


  } catch (error) {

    console.error(error);

    message.textContent =
      "网络连接失败，请稍后再试";

  }

}


/* =========================
   显示后台
========================= */

function showAdminPage() {

  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "adminPage"
    )
    .style.display =
    "block";


  loadOrders();

}


/* =========================
   退出
========================= */

function logout() {

  localStorage.removeItem(
    "adminToken"
  );


  token = "";

  orders = [];

  therapists = [];


  document
    .getElementById(
      "adminPage"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "loginPage"
    )
    .style.display =
    "flex";

}


/* =========================
   页面切换
========================= */

function showSection(
  section
) {

  document
    .getElementById(
      "ordersSection"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "therapistsSection"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "ordersNav"
    )
    .classList.remove(
      "active"
    );


  document
    .getElementById(
      "therapistsNav"
    )
    .classList.remove(
      "active"
    );


  if (
    section ===
    "orders"
  ) {

    document
      .getElementById(
        "ordersSection"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "ordersNav"
      )
      .classList.add(
        "active"
      );


    loadOrders();

  }


  if (
    section ===
    "therapists"
  ) {

    document
      .getElementById(
        "therapistsSection"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "therapistsNav"
      )
      .classList.add(
        "active"
      );


    loadTherapists();

  }

}


/* =========================

/* =========================
   日期
========================= */

function getLocalDateString(
  date
) {

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function getToday() {

  return getLocalDateString(
    new Date()
  );

}


function getTomorrow() {

  const tomorrow =
    new Date();


  tomorrow.setDate(
    tomorrow.getDate() + 1
  );


  return getLocalDateString(
    tomorrow
  );

}


/* =========================
   日期筛选
========================= */

function setDateFilter(

) {

  dateFilter =

  document
    .getElementById(

  ) {

      )

      );

/* =========================
   统计
========================= */

function updateStats() {

  const total =
    orders.length;


  const waiting =
    orders.filter(
      order =>
        order.status ===
        "待确认"
    ).length;


  const confirmed =
    orders.filter(
      order =>
        order.status ===
        "已确认"
    ).length;


  const working =
    orders.filter(
      order =>
        order.status ===
        "服务中"
    ).length;


  const finished =
    orders.filter(
      order =>
        order.status ===
        "已完成"
    ).length;


  const today =
    getToday();


  const todayOrders =
    orders.filter(
      order =>
        String(
          order.date || ""
        ) === today
    );


  let todayRevenue =
    0;


  todayOrders.forEach(
    order => {

      if (
        order.status !==
        "已取消"
      ) {

        todayRevenue +=
          Number(
            order.price
          ) || 0;

      }

    }
  );


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    total;


  document
    .getElementById(
      "waitingCount"
    )
    .textContent =
    waiting;


  document
    .getElementById(
      "confirmedCount"
    )
    .textContent =
    confirmed;


  document
    .getElementById(
      "workingCount"
    )
    .textContent =
    working;


  document
    .getElementById(
      "finishedCount"
    )
    .textContent =
    finished;


  document
    .getElementById(
      "todayCount"
    )
    .textContent =
    todayOrders.length;


  document
    .getElementById(
      "todayRevenue"
    )
    .textContent =
    "¥" +
    todayRevenue.toLocaleString();

}


/* =========================
   渲染订单
========================= */

function renderOrders() {

  const tbody =
    document.getElementById(
      "orderTableBody"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const status =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  let targetDate =
    "";


  if (
    dateFilter ===
    "today"
  ) {

    targetDate =
      getToday();

  }


  if (
    dateFilter ===
    "tomorrow"
  ) {

    targetDate =
      getTomorrow();

  }


  const filteredOrders =
    orders.filter(
      order => {

        const matchSearch =
          !search ||
          String(
            order.id || ""
          )
            .toLowerCase()
            .includes(search) ||

          String(
            order.name || ""
          )
            .toLowerCase()
            .includes(search) ||

          String(
            order.phone || ""
          )
            .toLowerCase()
            .includes(search);


        const matchStatus =
          !status ||
          order.status ===
          status;


        const matchDate =
          !targetDate ||
          String(
            order.date || ""
          ) ===
          targetDate;


        return (
          matchSearch &&
          matchStatus &&
          matchDate
        );

      }
    );


  if (
    filteredOrders.length ===
    0
  ) {

    tbody.innerHTML =
      '<tr><td colspan="12" class="empty">暂无符合条件的订单</td></tr>';

    return;

  }


  tbody.innerHTML =
    filteredOrders
      .map(
        order =>
          createOrderRow(
            order
          )
      )
      .join("");

}

/* =========================
   修改订单状态
========================= */

async function updateOrderStatus(
  orderId,
  status
) {

  try {

    const response =
      await fetch(
        "/api/orders/" +
        encodeURIComponent(
          orderId
        ) +
        "/status",
        {
          method: "PATCH",

          headers: {
            "Content-Type":
              "application/json",

            Authorization:
              "Bearer " +
              token
          },

          body:
            JSON.stringify({
              status
            })
        }
      );


    if (
      response.status ===
      401
    ) {

      logout();

      return;

    }


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      showToast(
        data.message ||
        "状态修改失败"
      );

      loadOrders();

      return;

    }


    const order =
      orders.find(
        item =>
          item.id ===
          orderId
      );


    if (order) {

      order.status =
        status;

    }


    updateStats();

    renderOrders();


    showToast(
      "订单状态已更新"
    );


  } catch (error) {

    console.error(error);

    showToast(
      "网络连接失败"
    );

  }

}


/* =========================
   删除订单
========================= */

async function deleteOrder(
  orderId
) {

  const order =
    orders.find(
      item =>
        item.id ===
        orderId
    );


  const confirmed =
    window.confirm(
      "确定要删除这个订单吗？\n\n" +
      "订单号：" +
      orderId +
      "\n" +
      "客户：" +
      (
        order
          ? order.name
          : ""
      ) +
      "\n\n" +
      "删除后无法恢复。"
    );


  if (!confirmed) {

    return;

  }


  try {

    const response =
      await fetch(
        "/api/orders/" +
        encodeURIComponent(
          orderId
        ),
        {
          method: "DELETE",

          headers: {
            Authorization:
              "Bearer " +
              token
          }
        }
      );


    if (
      response.status ===
      401
    ) {

      logout();

      return;

    }


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      showToast(
        data.message ||
        "删除失败"
      );

      return;

    }


    orders =
      orders.filter(
        item =>
          item.id !==
          orderId
      );


    updateStats();

    renderOrders();


    showToast(
      "订单已删除"
    );


  } catch (error) {

    console.error(error);

    showToast(
      "网络连接失败"
    );

  }

}

/* =========================
   时间格式
========================= */

function formatDateTime(
  value
) {

  if (!value) {

    return "-";

  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return String(value);

  }


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const hours =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day +
    " " +
    hours +
    ":" +
    minutes
  );

}


/* =========================
   HTML 安全处理
========================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   JS 安全处理
========================= */

function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    );

}


/* =========================
   Toast
========================= */

function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}
