<script>



/* =========================

   全局变量

========================= */



let allOrders = [];



let dateFilter = "all";



let currentPage = "orders";





/* =========================

   获取 Token

========================= */



function getToken() {



  return localStorage.getItem(

    "adminToken"

  );



}





/* =========================

   统一 API 请求

========================= */



async function apiFetch(

  url,

  options = {}

) {



  const token = getToken();



  const headers = {

    ...(options.headers || {})

  };



  if (token) {

    headers.Authorization =

      "Bearer " + token;

  }



  const response =

    await fetch(

      url,

      {

        ...options,

        headers

      }

    );



  if (

    response.status === 401

  ) {



    localStorage.removeItem(

      "adminToken"

    );



    logout();



    throw new Error(

      "登录已过期，请重新登录"

    );



  }



  const contentType =

    response.headers.get(

      "content-type"

    ) || "";



  let data;



  if (

    contentType.includes(

      "application/json"

    )

  ) {



    data =

      await response.json();



  } else {



    const text =

      await response.text();



    throw new Error(

      "服务器返回异常：" +

      text.substring(0,100)

    );



  }



  if (

    !response.ok ||

    data.success === false

  ) {



    throw new Error(

      data.message ||

      "请求失败"

    );



  }



  return data;



}





/* =========================

   登录

========================= */



async function login() {



  const username =

    document

      .getElementById(

        "username"

      )

      .value

      .trim();





  const password =

    document

      .getElementById(

        "password"

      )

      .value;





  const loginError =

    document.getElementById(

      "loginError"

    );





  const loginBtn =

    document.getElementById(

      "loginBtn"

    );





  loginError.textContent = "";





  if (!username || !password) {



    loginError.textContent =

      "请输入管理员账号和密码";



    return;



  }





  loginBtn.disabled = true;



  loginBtn.textContent =

    "正在登录...";





  try {



    const response =

      await fetch(

        "/api/admin/login",

        {

          method: "POST",



          headers: {

            "Content-Type":

              "application/json"

          },



          body:

            JSON.stringify({

              username,

              password

            })

        }

      );





    const contentType =

      response.headers.get(

        "content-type"

      ) || "";





    if (

      !contentType.includes(

        "application/json"

      )

    ) {



      throw new Error(

        "登录接口返回异常"

      );



    }





    const data =

      await response.json();





    if (

      !response.ok ||

      !data.success

    ) {



      loginError.textContent =

        data.message ||

        "账号或密码错误";



      return;



    }





    localStorage.setItem(

      "adminToken",

      data.token

    );





    showAdminPage();





    loadOrders();





  } catch (error) {



    console.error(error);



    loginError.textContent =

      error.message ||

      "登录失败，请检查网络";



  } finally {



    loginBtn.disabled = false;



    loginBtn.textContent =

      "登录后台";



  }



}





/* =========================

   显示后台

========================= */



function showAdminPage() {



  document

    .getElementById(

      "loginPage"

    )

    .style.display =

    "none";





  document

    .getElementById(

      "adminPage"

    )

    .style.display =

    "block";



}





/* =========================

   退出

========================= */



function logout() {



  localStorage.removeItem(

    "adminToken"

  );





  document

    .getElementById(

      "adminPage"

    )

    .style.display =

    "none";





  document

    .getElementById(

      "loginPage"

    )

    .style.display =

    "flex";





  document

    .getElementById(

      "password"

    )

    .value =

    "";



}





/* =========================

   切换页面

========================= */



function switchPage(page) {



  currentPage = page;





  document

    .querySelectorAll(

      ".admin-section"

    )

    .forEach(

      item => {



        item.classList.remove(

          "active"

        );



      }

    );





  document

    .querySelectorAll(

      ".nav-btn"

    )

    .forEach(

      item => {



        item.classList.remove(

          "active"

        );



      }

    );





  if (

    page === "orders"

  ) {



    document

      .getElementById(

        "ordersPage"

      )

      .classList.add(

        "active"

      );





    document

      .getElementById(

        "ordersNav"

      )

      .classList.add(

        "active"

      );





    loadOrders();



  }





  if (

    page === "therapists"

  ) {



    document

      .getElementById(

        "therapistsPage"

      )

      .classList.add(

        "active"

      );





    document

      .getElementById(

        "therapistsNav"

      )

      .classList.add(

        "active"

      );





    loadTherapists();



  }



}





/* =========================

   刷新

========================= */



function refreshCurrentPage() {



  if (

    currentPage === "orders"

  ) {



    loadOrders();



  } else {



    loadTherapists();



  }



}





/* =========================

   加载订单

========================= */



async function loadOrders() {



  const loading =

    document.getElementById(

      "loading"

    );





  const empty =

    document.getElementById(

      "empty"

    );





  const tableWrap =

    document.getElementById(

      "tableWrap"

    );





  if (!getToken()) {



    logout();



    return;



  }





  loading.style.display =

    "block";



  loading.textContent =

    "正在加载订单...";



  empty.style.display =

    "none";



  tableWrap.style.display =

    "none";





  try {



    const data =

      await apiFetch(

        "/api/orders"

      );





    allOrders =

      data.orders || [];





    updateStats();



    filterOrders();





    loading.style.display =

      "none";





  } catch (error) {



    console.error(error);



    loading.textContent =

      error.message ||

      "订单加载失败，请刷新重试";



  }



}





/* =========================

   日期辅助

========================= */



function localDateString(

  date

) {



  const year =

    date.getFullYear();



  const month =

    String(

      date.getMonth() + 1

    ).padStart(

      2,

      "0"

    );



  const day =

    String(

      date.getDate()

    ).padStart(

      2,

      "0"

    );



  return (

    year +

    "-" +

    month +

    "-" +

    day

  );



}





/* =========================

   统计

========================= */



function updateStats() {



  document

    .getElementById(

      "totalOrders"

    )

    .textContent =

    allOrders.length;





  document

    .getElementById(

      "pendingOrders"

    )

    .textContent =

    allOrders.filter(

      order =>

        order.status ===

        "待确认"

    ).length;





  const today =

    localDateString(

      new Date()

    );





  document

    .getElementById(

      "todayOrders"

    )

    .textContent =

    allOrders.filter(

      order =>

        order.date ===

        today

    ).length;





  document

    .getElementById(

      "completedOrders"

    )

    .textContent =

    allOrders.filter(

      order =>

        order.status ===

        "已完成"

    ).length;



}





/* =========================

   日期筛选

========================= */



function setDateFilter(

  type,

  button

) {



  dateFilter = type;





  document

    .querySelectorAll(

      ".quick-btn"

    )

    .forEach(

      btn =>

        btn.classList.remove(

        )

    );





  button.classList.add(

  );

}





/* =========================

   订单搜索

========================= */



function filterOrders() {



  const keyword =

    document

      .getElementById(

        "searchInput"

      )

      .value

      .trim()

      .toLowerCase();





  const status =

    document

      .getElementById(

        "statusFilter"

      )

      .value;





  const today =

    new Date();





  const todayString =

    localDateString(

      today

    );





  const tomorrow =

    new Date();



  tomorrow.setDate(

    tomorrow.getDate() + 1

  );





  const tomorrowString =

    localDateString(

      tomorrow

    );





  const filtered =

    allOrders.filter(

      order => {



        const keywordMatch =

          !keyword ||



          String(

            order.id || ""

          )

            .toLowerCase()

            .includes(

              keyword

            ) ||



          String(

            order.name || ""

          )

            .toLowerCase()

            .includes(

              keyword

            ) ||



          String(

            order.phone || ""

          )

            .includes(

              keyword

            );





        const statusMatch =

          !status ||

          order.status ===

          status;





        let dateMatch =

          true;





        if (

          dateFilter ===

          "today"

        ) {



          dateMatch =

            order.date ===

            todayString;



        }





        if (

          dateFilter ===

          "tomorrow"

        ) {



          dateMatch =

            order.date ===

            tomorrowString;



        }





        return (

          keywordMatch &&

          statusMatch &&

          dateMatch

        );



      }

    );





  renderOrders(

    filtered

  );



}





/* =========================

   渲染订单

========================= */



function renderOrders(

  orders

) {



  const empty =

    document.getElementById(

      "empty"

    );





  const tableWrap =

    document.getElementById(

      "tableWrap"

    );





  const ordersBody =

    document.getElementById(

      "ordersBody"

    );





  ordersBody.innerHTML =

    "";





  if (

    orders.length === 0

  ) {



    empty.style.display =

      "block";



    tableWrap.style.display =

      "none";



    return;



  }





  empty.style.display =

    "none";



  tableWrap.style.display =

    "block";





  orders.forEach(

    order => {



      const row =

        document.createElement(

          "tr"

        );





      const createdAt =

        order.createdAt

          ? new Date(

              order.createdAt

            ).toLocaleString(

              "zh-CN"

            )

          : "-";





      const statusList = [

        "待确认",

        "已确认",

        "服务中",

        "已完成",

        "已取消"

      ];





      let options =

        "";





      statusList.forEach(

        status => {



          const selected =

            order.status === status

              ? " selected"

              : "";





          options +=

            "<option value=\"" +

            escapeHtml(

              status

            ) +

            "\"" +

            selected +

            ">" +

            escapeHtml(

              status

            ) +

            "</option>";



        }

      );





      row.innerHTML =



        "<td>" +

        escapeHtml(

          order.id || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.service || "-"

        ) +

        "</td>" +



        "<td>¥" +

        escapeHtml(

          String(

            order.price || 0

          )

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.duration || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.therapist || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.date || "-"

        ) +

        "<br>" +

        escapeHtml(

          order.time || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.name || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.phone || "-"

        ) +

        "</td>" +



        "<td>" +

        escapeHtml(

          order.address || "-"

        ) +

        "</td>" +



        "<td>" +



        "<select class=\"status-select\">" +



        options +



        "</select>" +



        "</td>" +



        "<td>" +

        escapeHtml(

          createdAt

        ) +

        "</td>" +



        "<td>" +



        "<button class=\"delete-btn\">" +

        "删除" +

        "</button>" +



        "</td>";





      const statusSelect =

        row.querySelector(

          ".status-select"

        );





      statusSelect.addEventListener(

        "change",

        function() {



          updateOrderStatus(

            order.id,

            statusSelect.value

          );



        }

      );





      const deleteButton =

        row.querySelector(

          ".delete-btn"

        );





      deleteButton.addEventListener(

        "click",

        function() {



          deleteOrder(

            order.id

          );



        }

      );





      ordersBody.appendChild(

        row

      );



    }

  );



}





/* =========================

   修改订单状态

========================= */



async function updateOrderStatus(

  orderId,

  status

) {



  try {



    await apiFetch(

      "/api/orders/" +

      encodeURIComponent(

        orderId

      ) +

      "/status",

      {

        method: "PATCH",



        headers: {

          "Content-Type":

            "application/json"

        },



        body:

          JSON.stringify({

            status

          })

      }

    );





    loadOrders();





  } catch (error) {



    console.error(error);



    alert(

      error.message ||

      "订单状态修改失败"

    );



    loadOrders();



  }



}





/* =========================

   删除订单

========================= */



async function deleteOrder(

  orderId

) {



  const confirmed =

    confirm(

      "确定删除这个订单吗？\n删除后无法恢复。"

    );





  if (!confirmed) {



    return;



  }





  try {



    await apiFetch(

      "/api/orders/" +

      encodeURIComponent(

        orderId

      ),

      {

        method:

          "DELETE"

      }

    );





    alert(

      "订单已删除"

    );





    loadOrders();





  } catch (error) {



    console.error(error);



    alert(

      error.message ||

      "删除订单失败"

    );



  }



}

/* =========================

   加载疗愈师

========================= */



async function loadTherapists() {



  const loading =

    document.getElementById(

      "therapistLoading"

    );





  const grid =

    document.getElementById(

      "therapistGrid"

    );





  loading.style.display =

    "block";



  loading.textContent =

    "正在加载疗愈师...";



  grid.innerHTML =

    "";





  try {



    const data =

      await apiFetch(

        "/api/therapists"

      );





    const therapists =

      data.therapists || [];





    loading.style.display =

      "none";





    if (

      therapists.length === 0

    ) {



      grid.innerHTML =

        "<div class=\"empty\">" +

        "暂时还没有疗愈师，请点击右上角添加。" +

        "</div>";



      return;



    }





    therapists.forEach(

      therapist => {



        const card =

          document.createElement(

            "div"

          );





        card.className =

          "therapist-card";





        const avatar =

          therapist.avatar || "";





        const specialties =

          therapist.specialties || "";





        const tags =

          String(

            specialties

          )

          .split(

            /[,，、]/

          )

          .map(

            item =>

              item.trim()

          )

          .filter(

            Boolean

          );





        let tagsHtml =

          "";





        tags.forEach(

          tag => {



            tagsHtml +=

              "<span class=\"tag\">" +

              escapeHtml(

                tag

              ) +

              "</span>";



          }

        );





        const isActive =

          therapist.isActive !== false;





        const imageHtml =

          avatar

            ? "<img " +

              "class=\"therapist-image\" " +

              "src=\"" +

              escapeHtml(

                avatar

              ) +

              "\" " +

              "alt=\"" +

              escapeHtml(

                therapist.name ||

                "疗愈师"

              ) +

              "\">"

            : "<div " +

              "class=\"therapist-placeholder\">" +

              "暂无照片" +

              "</div>";





        card.innerHTML =



          imageHtml +



          "<div class=\"therapist-content\">" +



          "<div class=\"therapist-name\">" +

          escapeHtml(

            therapist.name ||

            "未命名"

          ) +

          "</div>" +



          "<div class=\"therapist-meta\">" +

          escapeHtml(

            therapist.experience ||

            "暂无经验资料"

          ) +

          "</div>" +



          "<div class=\"therapist-desc\">" +

          escapeHtml(

            therapist.bio ||

            "暂无简介"

          ) +

          "</div>" +



          "<div class=\"therapist-tags\">" +



          tagsHtml +



          "</div>" +



          "<div class=\"" +



          (

            isActive

              ? "status-badge status-active"

              : "status-badge status-inactive"

          ) +



          "\">" +



          (

            isActive

              ? "● 可预约"

              : "● 暂停预约"

          ) +



          "</div>" +



          "<div class=\"therapist-actions\">" +



          "<button class=\"edit-btn\">" +

          "编辑资料" +

          "</button>" +



          "<button class=\"card-delete-btn\">" +

          "删除" +

          "</button>" +



          "</div>" +



          "</div>";





        const editBtn =

          card.querySelector(

            ".edit-btn"

          );





        editBtn.addEventListener(

          "click",

          function() {



            openTherapistModal(

              therapist

            );



          }

        );





        const deleteBtn =

          card.querySelector(

            ".card-delete-btn"

          );





        deleteBtn.addEventListener(

          "click",

          function() {



            deleteTherapist(

              therapist.id

            );



          }

        );





        grid.appendChild(

          card

        );



      }

    );





  } catch (error) {



    console.error(error);



    loading.textContent =

      error.message ||

      "疗愈师加载失败，请刷新重试";



  }



}





/* =========================

   打开疗愈师弹窗

========================= */



function openTherapistModal(

  therapist = null

) {



  document

    .getElementById(

      "therapistModalMask"

    )

    .classList.add(

      "show"

    );





  document

    .getElementById(

      "therapistEditId"

    )

    .value =

    therapist

      ? therapist.id

      : "";





  document

    .getElementById(

      "therapistModalTitle"

    )

    .textContent =

    therapist

      ? "编辑疗愈师"

      : "添加疗愈师";





  document

    .getElementById(

      "therapistName"

    )

    .value =

    therapist

      ? therapist.name || ""

      : "";





  document

    .getElementById(

      "therapistAvatar"

    )

    .value =

    therapist

      ? therapist.avatar || ""

      : "";





  document

    .getElementById(

      "therapistBio"

    )

    .value =

    therapist

      ? therapist.bio || ""

      : "";





  document

    .getElementById(

      "therapistExperience"

    )

    .value =

    therapist

      ? therapist.experience || ""

      : "";





  document

    .getElementById(

      "therapistSpecialties"

    )

    .value =

    therapist

      ? therapist.specialties || ""

      : "";





  document

    .getElementById(

      "therapistIsActive"

    )

    .value =

    therapist &&

    therapist.isActive === false

      ? "false"

      : "true";



}





/* =========================

   关闭弹窗

========================= */



function closeTherapistModal() {



  document

    .getElementById(

      "therapistModalMask"

    )

    .classList.remove(

      "show"

    );



}





/* =========================

   保存疗愈师

========================= */



async function saveTherapist() {



  const id =

    document

      .getElementById(

        "therapistEditId"

      )

      .value;





  const name =

    document

      .getElementById(

        "therapistName"

      )

      .value

      .trim();





  const avatar =

    document

      .getElementById(

        "therapistAvatar"

      )

      .value

      .trim();





  const bio =

    document

      .getElementById(

        "therapistBio"

      )

      .value

      .trim();





  const experience =

    document

      .getElementById(

        "therapistExperience"

      )

      .value

      .trim();





  const specialties =

    document

      .getElementById(

        "therapistSpecialties"

      )

      .value

      .trim();





  const isActive =

    document

      .getElementById(

        "therapistIsActive"

      )

      .value ===

    "true";





  const saveBtn =

    document.getElementById(

      "saveTherapistBtn"

    );





  if (!name) {



    alert(

      "请输入疗愈师姓名"

    );



    return;



  }





  const payload = {



    name,

    avatar,

    bio,

    experience,

    specialties,

    isActive



  };





  let url =

    "/api/therapists";





  let method =

    "POST";





  if (id) {



    url =

      "/api/therapists/" +

      encodeURIComponent(

        id

      );





    method =

      "PUT";



  }





  saveBtn.disabled =

    true;



  saveBtn.textContent =

    "正在保存...";





  try {



    await apiFetch(

      url,

      {

        method,



        headers: {

          "Content-Type":

            "application/json"

        },



        body:

          JSON.stringify(

            payload

          )

      }

    );





    closeTherapistModal();





    await loadTherapists();





    alert(

      id

        ? "疗愈师资料已更新"

        : "疗愈师添加成功"

    );





  } catch (error) {



    console.error(error);



    alert(

      error.message ||

      "保存失败"

    );



  } finally {



    saveBtn.disabled =

      false;



    saveBtn.textContent =

      "保存疗愈师";



  }



}





/* =========================

   删除疗愈师

========================= */



async function deleteTherapist(

  id

) {



  const confirmed =

    confirm(

      "确定删除这位疗愈师吗？\n删除后预约页面将不再显示。"

    );





  if (!confirmed) {



    return;



  }





  try {



    await apiFetch(

      "/api/therapists/" +

      encodeURIComponent(

        id

      ),

      {

        method:

          "DELETE"

      }

    );





    alert(

      "疗愈师已删除"

    );





    loadTherapists();





  } catch (error) {



    console.error(error);



    alert(

      error.message ||

      "删除失败"

    );



  }



}





/* =========================

   HTML 转义

========================= */



function escapeHtml(

  value

) {



  const div =

    document.createElement(

      "div"

    );





  div.textContent =

    value === undefined ||

    value === null

      ? ""

      : String(

          value

        );





  return div.innerHTML;



}

   回车登录

========================= */



document

  .getElementById(

    "password"

  )

  .addEventListener(

    "keydown",

    function(event) {



      if (

        event.key ===

        "Enter"

      ) {



        login();



      }



    }

  );





/* =========================

   点击遮罩关闭弹窗

========================= */



document

  .getElementById(

    "therapistModalMask"

  )

  .addEventListener(

    "click",

    function(event) {



      if (

        event.target ===

        this

      ) {



        closeTherapistModal();



      }



    }

  );





/* =========================

   自动登录

========================= */



const savedToken =

  getToken();





if (savedToken) {



  showAdminPage();



  loadOrders();



}
