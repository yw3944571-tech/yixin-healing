<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>奕心疗愈舍｜管理后台</title>



<style>

* {

  box-sizing: border-box;

}



body {

  margin: 0;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Segoe UI",

    "PingFang SC",

    "Microsoft YaHei",

    sans-serif;

  background: #f5f3ef;

  color: #292725;

}



button,

input,

select {

  font: inherit;

}



.hidden {

  display: none !important;

}



/* =========================

   登录

========================= */



.login-page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}



.login-card {

  width: 100%;

  max-width: 420px;

  background: #fff;

  padding: 42px;

  border-radius: 18px;

  box-shadow: 0 15px 50px rgba(0,0,0,.08);

}



.logo {

  text-align: center;

  font-size: 28px;

  letter-spacing: 5px;

  margin-bottom: 8px;

}



.subtitle {

  text-align: center;

  color: #888;

  margin-bottom: 32px;

}



.form-group {

  margin-bottom: 18px;

}



.form-group label {

  display: block;

  margin-bottom: 8px;

  font-size: 14px;

}



.form-group input,

.form-group select {

  width: 100%;

  height: 44px;

  border: 1px solid #ddd;

  border-radius: 8px;

  padding: 0 12px;

  background: #fff;

}



.primary-btn {

  width: 100%;

  height: 46px;

  border: 0;

  border-radius: 8px;

  background: #292725;

  color: #fff;

  cursor: pointer;

}



.primary-btn:hover {

  opacity: .9;

}



.login-message {

  margin-top: 15px;

  color: #c44;

  text-align: center;

  font-size: 14px;

}





/* =========================

   后台整体

========================= */



.admin-page {

  min-height: 100vh;

}



.header {

  height: 70px;

  background: #fff;

  border-bottom: 1px solid #eee;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 30px;

}



.header-title {

  font-size: 20px;

  letter-spacing: 3px;

}



.logout-btn {

  border: 1px solid #ddd;

  background: #fff;

  padding: 8px 16px;

  border-radius: 7px;

  cursor: pointer;

}



.layout {

  display: flex;

  min-height: calc(100vh - 70px);

}



.sidebar {

  width: 220px;

  background: #292725;

  padding: 20px 12px;

}



.nav-btn {

  width: 100%;

  border: 0;

  background: transparent;

  color: #bbb;

  padding: 14px 16px;

  text-align: left;

  border-radius: 8px;

  cursor: pointer;

  margin-bottom: 5px;

}



.nav-btn.active {

  background: #44403c;

  color: #fff;

}



.main {

  flex: 1;

  padding: 30px;

  overflow-x: auto;

}





/* =========================

   标题

========================= */



.page-title {

  font-size: 24px;

  margin-bottom: 25px;

}



.page-title small {

  display: block;

  font-size: 13px;

  color: #999;

  margin-top: 7px;

}





/* =========================

   数据统计

========================= */



.stats {

  display: grid;

  grid-template-columns:

    repeat(7, minmax(130px, 1fr));

  gap: 14px;

  margin-bottom: 25px;

}



.stat-card {

  background: #fff;

  border-radius: 12px;

  padding: 18px;

  box-shadow: 0 4px 20px rgba(0,0,0,.03);

}



.stat-title {

  font-size: 13px;

  color: #999;

}



.stat-number {

  margin-top: 8px;

  font-size: 25px;

  font-weight: 600;

}





/* =========================

   工具栏

========================= */



.toolbar {

  background: #fff;

  border-radius: 12px;

  padding: 16px;

  margin-bottom: 18px;

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}



.toolbar input,

.toolbar select {

  height: 40px;

  border: 1px solid #ddd;

  border-radius: 7px;

  padding: 0 10px;

}



.toolbar button {

  height: 40px;

  padding: 0 15px;

  border: 1px solid #ddd;

  background: #fff;

  border-radius: 7px;

  cursor: pointer;

}



.toolbar button:hover {

  background: #f5f5f5;

}





/* =========================

   表格

========================= */



.table-card {

  background: #fff;

  border-radius: 12px;

  overflow-x: auto;

  box-shadow: 0 4px 20px rgba(0,0,0,.03);

}



table {

  width: 100%;

  min-width: 1250px;

  border-collapse: collapse;

}



th,

td {

  padding: 14px 12px;

  border-bottom: 1px solid #eee;

  text-align: left;

  white-space: nowrap;

  font-size: 13px;

}



th {

  background: #fafafa;

  color: #777;

  font-weight: 500;

}



.status-select {

  height: 34px;

  border: 1px solid #ddd;

  border-radius: 6px;

  padding: 0 7px;

}



.delete-btn {

  border: 1px solid #e3caca;

  color: #b44;

  background: #fff;

  padding: 6px 10px;

  border-radius: 6px;

  cursor: pointer;

}





/* =========================

   通用卡片

========================= */



.card {

  background: #fff;

  border-radius: 12px;

  padding: 22px;

  margin-bottom: 20px;

}



.card-title {

  font-size: 17px;

  margin-bottom: 18px;

}





/* =========================

   疗愈师

========================= */



.therapist-add {

  display: flex;

  gap: 10px;

}



.therapist-add input {

  width: 300px;

  height: 42px;

  border: 1px solid #ddd;

  border-radius: 7px;

  padding: 0 12px;

}



.therapist-add button {

  height: 42px;

  padding: 0 20px;

  border: 0;

  border-radius: 7px;

  background: #292725;

  color: #fff;

  cursor: pointer;

}



.therapist-table {

  width: 100%;

  min-width: 650px;

}



.active-text {

  color: #39805a;

}



.inactive-text {

  color: #999;

}



.small-btn {

  border: 1px solid #ddd;

  background: #fff;

  padding: 6px 12px;

  border-radius: 6px;

  cursor: pointer;

}





/* =========================

   排班

========================= */



.schedule-form {

  display: grid;

  grid-template-columns:

    1.2fr 1fr 1fr 1fr auto;

  gap: 12px;

  align-items: end;

}



.schedule-form label {

  display: block;

  font-size: 13px;

  color: #777;

  margin-bottom: 7px;

}



.schedule-form select,

.schedule-form input {

  width: 100%;

  height: 42px;

  border: 1px solid #ddd;

  border-radius: 7px;

  padding: 0 10px;

  background: #fff;

}



.schedule-submit {

  height: 42px;

  border: 0;

  background: #292725;

  color: #fff;

  padding: 0 22px;

  border-radius: 7px;

  cursor: pointer;

}



.schedule-table {

  width: 100%;

  min-width: 750px;

}



.schedule-empty {

  text-align: center;

  padding: 35px;

  color: #999;

}





/* =========================

   Toast

========================= */



.toast {

  position: fixed;

  right: 25px;

  bottom: 25px;

  background: #292725;

  color: #fff;

  padding: 13px 20px;

  border-radius: 8px;

  display: none;

  z-index: 9999;

}





/* =========================

   手机

========================= */



@media (max-width: 900px) {



  .sidebar {

    width: 170px;

  }



  .main {

    padding: 20px;

  }



  .stats {

    grid-template-columns:

      repeat(2, 1fr);

  }



  .schedule-form {

    grid-template-columns: 1fr;

  }



}



@media (max-width: 600px) {



  .header {

    padding: 0 15px;

  }



  .header-title {

    font-size: 16px;

  }



  .layout {

    display: block;

  }



  .sidebar {

    width: 100%;

    display: flex;

    overflow-x: auto;

    padding: 8px;

  }



  .nav-btn {

    width: auto;

    white-space: nowrap;

    margin-right: 5px;

  }



  .main {

    padding: 15px;

  }



}

</style>

</head>



<body>





<!-- =========================

     登录页面

========================= -->



<div

  id="loginPage"

  class="login-page"

>



  <div class="login-card">



    <div class="logo">

      奕心疗愈舍

    </div>



    <div class="subtitle">

      管理后台

    </div>



    <div class="form-group">



      <label>

        管理员账号

      </label>



      <input

        id="username"

        type="text"

        autocomplete="username"

        placeholder="请输入管理员账号"

      >



    </div>





    <div class="form-group">



      <label>

        管理员密码

      </label>



      <input

        id="password"

        type="password"

        autocomplete="current-password"

        placeholder="请输入管理员密码"

      >



    </div>





    <button

      class="primary-btn"

      onclick="login()"

    >

      登录后台

    </button>





    <div

      id="loginMessage"

      class="login-message"

    ></div>



  </div>



</div>





<!-- =========================

     管理后台

========================= -->



<div

  id="adminPage"

  class="admin-page hidden"

>



  <header class="header">



    <div class="header-title">

      奕心疗愈舍 · 管理后台

    </div>



    <button

      class="logout-btn"

      onclick="logout()"

    >

      退出登录

    </button>



  </header>





  <div class="layout">



    <!-- 左侧导航 -->



    <aside class="sidebar">



      <button

        id="navOrders"

        class="nav-btn active"

        onclick="showSection('orders')"

      >

        📋 订单管理

      </button>



      <button

      >

        👤 疗愈师管理

      </button>



      <button

        id="navSchedules"

        class="nav-btn"

        onclick="showSection('schedules')"

      >

      </button>



    </aside>





    <!-- 主区域 -->



    <main class="main">





      <!-- =========================

           订单管理

      ========================= -->



      <section

        id="ordersSection"

      >



        <div class="page-title">



          订单管理



          <small>

            奕心疗愈舍预约订单

          </small>



        </div>





        <div class="stats">



          <div class="stat-card">

            <div class="stat-title">

              总订单

            </div>

            <div

              id="statTotal"

              class="stat-number"

            >

              0

            </div>

          </div>





          <div class="stat-card">

            <div class="stat-title">

              待确认

            </div>

            <div

              id="statPending"

              class="stat-number"

            >

              0

            </div>

          </div>





          <div class="stat-card">

            <div class="stat-title">

              已确认

            </div>

            <div

              id="statConfirmed"

              class="stat-number"

            >

              0

            </div>

          </div>





          <div class="stat-card">

            <div class="stat-title">

              服务中

            </div>

            <div

              id="statServing"

              class="stat-number"

            >

              0

            </div>

          </div>





          <div class="stat-card">

            <div class="stat-title">

              已完成

            </div>

            <div

              id="statCompleted"

              class="stat-number"

            >

              0

            </div>

          </div>





          <div class="stat-card">

            <div class="stat-title">

              今日订单

            </div>

            <div

              id="statToday"

              class="stat-number"

            >

              0

          </div>





          <div class="stat-card">

            <div class="stat-title">

              今日营业额

            </div>

            <div

              class="stat-number"

            >

              ¥0

            </div>

          </div>



        </div>





        <div class="toolbar">



          <input

            id="searchInput"

            type="text"

            placeholder="搜索订单号 / 姓名 / 手机号"

            oninput="renderOrders()"

          >





          <select

            id="statusFilter"

            onchange="renderOrders()"

          >



            <option value="">

            <option value="待确认">

              待确认

            </option>



            <option value="已确认">

            <option value="服务中">

              服务中

            </option>



            <option value="已完成">

              已完成

            </option>



            <option value="已取消">

          </select>





          <button

          <button

          <button

          >

            明天订单

          <button

            刷新

        <div class="table-card">

      <!-- =========================

      ========================= -->

      <!-- =========================

<div

  id="toast"

  class="toast"

></div>





<script>



let token =

  localStorage.getItem(

    "yixin_admin_token"

  );



let orders = [];



let therapists = [];



let schedules = [];



let selectedDateFilter = "";





// =========================

// 登录

// =========================



async function login() {



  const username =

    document

      .getElementById("username")

      .value

      .trim();



  const password =

    document

      .getElementById("password")

      .value;





  if (!username || !password) {



    document

      .getElementById("loginMessage")

      .textContent =

        "请输入账号和密码";



    return;



  }





  try {



    const response =

      await fetch(

        "/api/admin/login",

        {

          method: "POST",



          headers: {

            "Content-Type":

              "application/json"

          },



          body:

            JSON.stringify({

              username,

              password

            })

        }

      );





    const data =

      await response.json();





    if (!response.ok) {



      document

        .getElementById("loginMessage")

        .textContent =

          data.message ||

          "登录失败";



      return;



    }





    token =

      data.token;





    localStorage.setItem(

      "yixin_admin_token",

      token

    );





    showAdminPage();





  } catch (error) {



    document

      .getElementById("loginMessage")

      .textContent =

        "服务器连接失败";



  }



}





// =========================

// 显示后台

// =========================



function showAdminPage() {



  document

    .getElementById("loginPage")

    .classList

    .add("hidden");





  document

    .getElementById("adminPage")

    .classList

    .remove("hidden");





  loadOrders();



  loadTherapists();



  loadSchedules();



}





// =========================

// 退出

// =========================



function logout() {



  localStorage.removeItem(

    "yixin_admin_token"

  );



  token = null;



  location.reload();



}





// =========================

// 页面导航

// =========================



function showSection(

  section

) {



  document

    .getElementById("ordersSection")

    .classList

    .add("hidden");



  document

    .getElementById("therapistsSection")

    .classList

    .add("hidden");



  document

    .getElementById("schedulesSection")

    .classList

    .add("hidden");





  document

    .getElementById("navOrders")

    .classList

    .remove("active");



  document

    .getElementById("navTherapists")

    .classList

    .remove("active");



  document

    .getElementById("navSchedules")

    .classList

    .remove("active");





  if (

    section ===

    "orders"

  ) {



    document

      .getElementById("ordersSection")

      .classList

      .remove("hidden");



    document

      .getElementById("navOrders")

      .classList

      .add("active");



    loadOrders();



  }





  if (

    section ===

    "therapists"

  ) {



    document

      .getElementById("therapistsSection")

      .classList

      .remove("hidden");



    document

      .getElementById("navTherapists")

      .classList

      .add("active");



    loadTherapists();



  }





  if (

    section ===

    "schedules"

  ) {



    document

      .getElementById("schedulesSection")

      .classList

      .remove("hidden");



    document

      .getElementById("navSchedules")

      .classList

      .add("active");



    loadTherapists();



    loadSchedules();



  }



}





// =========================

// 通用请求

// =========================



async function apiFetch(

  url,

  options = {}

) {



  options.headers = {

    ...(options.headers || {}),

    Authorization:

      "Bearer " + token,

    "Content-Type":

      "application/json"

  };





  const response =

    await fetch(

      url,

      options

    );





  if (

    response.status ===

    401

  ) {



    logout();



    throw new Error(

      "登录已过期"

    );



  }





  return response;



}





// =========================

// 获取订单

// =========================



async function loadOrders() {



  try {



    const response =

      await apiFetch(

        "/api/orders"

      );





    const data =

      await response.json();





    if (!response.ok) {



      showToast(

        data.message ||

        "获取订单失败"

      );



      return;



    }





    orders =

      data.orders ||

      [];





    updateStats();



    renderOrders();





  } catch (error) {



    console.error(

      error

    );



  }



}





// =========================

// 日期

// =========================



function getLocalDateString(

  date

) {



  const year =

    date.getFullYear();



  const month =

    String(

      date.getMonth() + 1

    ).padStart(

      2,

      "0"

    );



  const day =

    String(

      date.getDate()

    ).padStart(

      2,

      "0"

    );





  return (

    year +

    "-" +

    month +

    "-" +

    day

  );



}





function getToday() {



  return getLocalDateString(

    new Date()

  );



}





function getTomorrow() {



  const date =

    new Date();



  date.setDate(

    date.getDate() + 1

  );



  return getLocalDateString(

    date

  );



}





function setDateFilter(

  date

) {



  selectedDateFilter =

    date;



  renderOrders();



}





// =========================

// 订单统计

// =========================



function updateStats() {



  const total =

    orders.length;





  const pending =

    orders.filter(

      o =>

        o.status ===

        "待确认"

    ).length;





  const confirmed =

    orders.filter(

      o =>

        o.status ===

        "已确认"

    ).length;





  const serving =

    orders.filter(

      o =>

        o.status ===

        "服务中"

    ).length;





  const completed =

    orders.filter(

      o =>

        o.status ===

        "已完成"

    ).length;





  const today =

    getToday();





  const todayOrders =

    orders.filter(

      o =>

        String(

          o.date

        ) === today

    );





  const revenue =

    todayOrders.reduce(

      (

        total,

        order

      ) =>

        total +

        Number(

          order.price

        || 0

        ),

      0

    );





  document

    .getElementById("statTotal")

    .textContent =

      total;





  document

    .getElementById("statPending")

    .textContent =

      pending;





  document

    .getElementById("statConfirmed")

    .textContent =

      confirmed;





  document

    .getElementById("statServing")

    .textContent =

      serving;





  document

    .getElementById("statCompleted")

    .textContent =

      completed;





  document

    .getElementById("statToday")

    .textContent =

      todayOrders.length;





  document

    .getElementById("statRevenue")

    .textContent =

      "¥" +

      revenue;



}





// =========================

// 渲染订单

// =========================



function renderOrders() {



  const body =

    document

      .getElementById("ordersBody");





  const search =

    document

      .getElementById("searchInput")

      .value

      .trim()

      .toLowerCase();





  const status =

    document

      .getElementById("statusFilter")

      .value;





  let filtered =

    orders.filter(

      order => {



        const text =

          (

            String(

              order.id || ""

            ) +

            " " +

            String(

              order.name || ""

            ) +

            " " +

            String(

              order.phone || ""

            )

          )

            .toLowerCase();





        const matchSearch =

          !search ||

          text.includes(

            search

          );





        const matchStatus =

          !status ||

          order.status ===

            status;





        const matchDate =

          !selectedDateFilter ||

          String(

            order.date

          ) ===

            selectedDateFilter;





        return (

          matchSearch &&

          matchStatus &&

          matchDate

        );



      }

    );





  if (

    filtered.length ===

    0

  ) {



    body.innerHTML =

      '<tr><td colspan="12" style="text-align:center;padding:40px;color:#999;">暂无订单</td></tr>';



    return;



  }





  body.innerHTML =

    filtered

      .map(

        createOrderRow

      )

      .join("");



}

// =========================

// 时间格式

// =========================



function formatDateTime(

  value

) {



  if (!value) {



    return "";



  }





  try {



    const date =

      new Date(value);





    if (

      Number.isNaN(

        date.getTime()

      )

    ) {



      return String(value);



    }





    return (

      date.getFullYear() +

      "-" +

      String(

        date.getMonth() + 1

      ).padStart(2, "0") +

      "-" +

      String(

        date.getDate()

      ).padStart(2, "0") +

      " " +

      String(

        date.getHours()

      ).padStart(2, "0") +

      ":" +

      String(

        date.getMinutes()

      ).padStart(2, "0")

    );



  } catch (error) {



    return String(value);



  }



}





// =========================

// HTML 安全

// =========================



function escapeHtml(

  value

) {



  return String(

    value ?? ""

  )

    .replace(

      /&/g,

      "&amp;"

    )

    .replace(

      /</g,

      "&lt;"

    )

    .replace(

      />/g,

      "&gt;"

    )

    .replace(

      /"/g,

      "&quot;"

    )

    .replace(

      /'/g,

      "&#039;"

    );



}





function escapeJs(

  value

) {



  return String(

    value ?? ""

  )

    .replace(

      /\\/g,

      "\\\\"

    )

    .replace(

      /'/g,

      "\\'"

    )

    .replace(

      /"/g,

      '\\"'

    );



}





// =========================

// Toast

// =========================



function showToast(

  message

) {



  const toast =

    document

      .getElementById(

        "toast"

      );





  toast.textContent =

    message;





  toast.style.display =

    "block";





  clearTimeout(

    window.toastTimer

  );





  window.toastTimer =

    setTimeout(

      () => {



        toast.style.display =

          "none";



      },

      2500

    );



}
