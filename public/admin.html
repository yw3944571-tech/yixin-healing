<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>奕心疗愈舍｜订单管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      background: #f6f3ee;
      color: #2d2926;
    }

    .header {
      background: #292421;
      color: white;

      padding: 20px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 20px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .refresh-btn {
      border: none;

      background: #c6a56b;
      color: white;

      padding: 10px 18px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 14px;
    }

    .refresh-btn:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 18px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;

      padding: 20px;

      border-radius: 12px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.05);
    }

    .stat-label {
      font-size: 13px;
      color: #888;
    }

    .stat-number {
      font-size: 30px;
      margin-top: 10px;

      font-weight: 600;

      color: #2d2926;
    }

    .table-card {
      background: white;

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.05);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;

      min-width: 1000px;
    }

    th {
      background: #f1ece4;

      text-align: left;

      padding: 15px;

      font-size: 13px;

      white-space: nowrap;
    }

    td {
      padding: 15px;

      border-top:
        1px solid #eee;

      font-size: 14px;

      vertical-align: top;
    }

    .status {
      display: inline-block;

      padding: 5px 10px;

      border-radius: 20px;

      font-size: 12px;

      background: #fff4d6;

      color: #9a6a00;
    }

    .empty {
      padding: 80px 20px;

      text-align: center;

      color: #999;
    }

    .loading {
      padding: 50px;

      text-align: center;

      color: #888;
    }

    @media (max-width: 600px) {

      .header-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      .container {
        margin-top: 20px;
      }

    }
  </style>

</head>

<body>

  <header class="header">

```
<div class="header-inner">

  <div>

    <div class="brand">
      奕心疗愈舍 · 订单管理
    </div>

    <div class="subtitle">
      YIXIN HEALING · APPOINTMENT SYSTEM
    </div>

  </div>

  <button
    class="refresh-btn"
    onclick="loadOrders()"
  >
    刷新订单
  </button>

</div>
```

  </header>

  <main class="container">

```
<section class="stats">

  <div class="stat-card">

    <div class="stat-label">
      总订单
    </div>

    <div
      class="stat-number"
      id="totalOrders"
    >
      0
    </div>

  </div>


  <div class="stat-card">

    <div class="stat-label">
      待确认
    </div>

    <div
      class="stat-number"
      id="pendingOrders"
    >
      0
    </div>

  </div>

</section>


<section class="table-card">

  <div
    class="loading"
    id="loading"
  >
    正在加载订单...
  </div>


  <div
    class="empty"
    id="empty"
    style="display: none"
  >
    暂时还没有预约订单
  </div>


  <div
    class="table-wrap"
    id="tableWrap"
    style="display: none"
  >

    <table>

      <thead>

        <tr>

          <th>订单号</th>

          <th>服务</th>

          <th>价格</th>

          <th>时长</th>

          <th>疗愈师</th>

          <th>预约时间</th>

          <th>客户</th>

          <th>手机号</th>

          <th>服务地址</th>

          <th>状态</th>

          <th>下单时间</th>

        </tr>

      </thead>


      <tbody
        id="ordersBody"
      >
      </tbody>

    </table>

  </div>

</section>
```

  </main>

  <script>

    async function loadOrders() {

      const loading =
        document.getElementById(
          "loading"
        );

      const empty =
        document.getElementById(
          "empty"
        );

      const tableWrap =
        document.getElementById(
          "tableWrap"
        );

      const ordersBody =
        document.getElementById(
          "ordersBody"
        );


      loading.style.display =
        "block";

      empty.style.display =
        "none";

      tableWrap.style.display =
        "none";


      try {

        const response =
          await fetch(
            "/api/orders"
          );


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message ||
            "获取订单失败"
          );

        }


        const orders =
          data.orders || [];


        document.getElementById(
          "totalOrders"
        ).textContent =
          orders.length;


        document.getElementById(
          "pendingOrders"
        ).textContent =
          orders.filter(
            order =>
              order.status ===
              "待确认"
          ).length;


        ordersBody.innerHTML =
          "";


        loading.style.display =
          "none";


        if (
          orders.length === 0
        ) {

          empty.style.display =
            "block";

          return;

        }


        tableWrap.style.display =
          "block";


        orders.forEach(
          order => {

            const row =
              document.createElement(
                "tr"
              );


            const createdAt =
              order.createdAt
                ? new Date(
                    order.createdAt
                  ).toLocaleString(
                    "zh-CN"
                  )
                : "-";


            row.innerHTML =
              `
              <td>${order.id || "-"}</td>

              <td>${order.service || "-"}</td>

              <td>¥${order.price || 0}</td>

              <td>${order.duration || "-"}</td>

              <td>${order.therapist || "-"}</td>

              <td>
                ${order.date || "-"}
                <br>
                ${order.time || "-"}
              </td>

              <td>${order.name || "-"}</td>

              <td>${order.phone || "-"}</td>

              <td>${order.address || "-"}</td>

              <td>
                <span class="status">
                  ${order.status || "-"}
                </span>
              </td>

              <td>${createdAt}</td>
              `;


            ordersBody.appendChild(
              row
            );

          }

        );

      } catch (
        error
      ) {

        console.error(
          error
        );


        loading.textContent =
          "订单加载失败，请刷新重试";

      }

    }


    loadOrders();

  </script>

</body>
</html>
