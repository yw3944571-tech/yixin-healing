<!DOCTYPE html>

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>奕心疗愈舍｜订单管理</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

      background: #f6f3ee;

      color: #2d2926;
    }


    /* =====================
       登录页面
    ===================== */

    #loginPage {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }


    .login-card {
      width: 100%;

      max-width: 400px;

      background: white;

      padding: 36px;

      border-radius: 18px;

      box-shadow:
        0 10px 40px
        rgba(0, 0, 0, 0.08);
    }


    .login-title {
      margin: 0;

      color: #292421;

      font-size: 26px;
    }


    .login-subtitle {
      margin-top: 8px;

      margin-bottom: 28px;

      color: #999;

      font-size: 13px;

      letter-spacing: 0.5px;
    }


    .login-input {
      width: 100%;

      padding: 14px;

      margin-bottom: 16px;

      border:
        1px solid #ddd;

      border-radius: 9px;

      font-size: 15px;

      outline: none;
    }


    .login-input:focus {
      border-color:
        #c6a56b;
    }


    .login-btn {
      width: 100%;

      border: none;

      background:
        #292421;

      color: white;

      padding: 14px;

      border-radius: 9px;

      font-size: 15px;

      cursor: pointer;
    }


    .login-btn:hover {
      opacity: 0.9;
    }


    .login-error {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      color: #c0392b;

      font-size: 14px;
    }


    /* =====================
       管理后台
    ===================== */

    .header {
      background:
        #292421;

      color: white;

      padding: 20px;
    }


    .header-inner {
      max-width: 1200px;

      margin: auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .brand {
      font-size: 20px;

      font-weight: 600;
    }


    .subtitle {
      font-size: 13px;

      opacity: 0.7;

      margin-top: 5px;
    }


    .header-actions {
      display: flex;

      gap: 10px;

      align-items: center;
    }


    .refresh-btn {
      border: none;

      background:
        #c6a56b;

      color: white;

      padding:
        10px 18px;

      border-radius:
        8px;

      cursor: pointer;

      font-size: 14px;
    }


    .logout-btn {
      border:
        1px solid
        rgba(255,255,255,0.3);

      background:
        transparent;

      color: white;

      padding:
        10px 18px;

      border-radius:
        8px;

      cursor: pointer;

      font-size: 14px;
    }


    .refresh-btn:hover,
    .logout-btn:hover {
      opacity: 0.9;
    }


    .container {
      max-width:
        1200px;

      margin:
        30px auto;

      padding:
        0 20px;
    }


    .stats {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            180px,
            1fr
          )
        );

      gap:
        18px;

      margin-bottom:
        25px;
    }


    .stat-card {
      background:
        white;

      padding:
        20px;

      border-radius:
        12px;

      box-shadow:
        0 4px 20px
        rgba(
          0,
          0,
          0,
          0.05
        );
    }


    .stat-label {
      font-size:
        13px;

      color:
        #888;
    }


    .stat-number {
      font-size:
        30px;

      margin-top:
        10px;

      font-weight:
        600;

      color:
        #2d2926;
    }


    .table-card {
      background:
        white;

      border-radius:
        12px;

      overflow:
        hidden;

      box-shadow:
        0 4px 20px
        rgba(
          0,
          0,
          0,
          0.05
        );
    }


    .table-wrap {
      overflow-x:
        auto;
    }


    table {
      width:
        100%;

      border-collapse:
        collapse;

      min-width:
        1000px;
    }


    th {
      background:
        #f1ece4;

      text-align:
        left;

      padding:
        15px;

      font-size:
        13px;

      white-space:
        nowrap;
    }


    td {
      padding:
        15px;

      border-top:
        1px solid #eee;

      font-size:
        14px;

      vertical-align:
        top;
    }


    .status {
      display:
        inline-block;

      padding:
        5px 10px;

      border-radius:
        20px;

      font-size:
        12px;

      background:
        #fff4d6;

      color:
        #9a6a00;
    }


    .empty {
      padding:
        80px 20px;

      text-align:
        center;

      color:
        #999;
    }


    .loading {
      padding:
        50px;

      text-align:
        center;

      color:
        #888;
    }


    @media (
      max-width:
      600px
    ) {

      .header-inner {
        align-items:
          flex-start;

        flex-direction:
          column;
      }


      .header-actions {
        width:
          100%;
      }


      .refresh-btn,
      .logout-btn {
        flex:
          1;
      }


      .container {
        margin-top:
          20px;
      }

    }
.status-select {
border: none;

background: #fff4d6;

color: #9a6a00;

padding: 6px 10px;

border-radius: 20px;

font-size: 12px;

cursor: pointer;

outline: none;
}

.status-select:disabled {
opacity: 0.6;

cursor: wait;
}

  </style>

</head>

<body>

  <!-- =====================
       登录页面
  ====================== -->

  <div
    id="loginPage"
  >

<div
  class="login-card"
>

  <h1
    class="login-title"
  >
    奕心疗愈舍
  </h1>


  <div
    class="login-subtitle"
  >
    ADMIN LOGIN · 管理员登录
  </div>


  <input
    id="username"
    class="login-input"
    type="text"
    placeholder="管理员账号"
    autocomplete="username"
  >


  <input
    id="password"
    class="login-input"
    type="password"
    placeholder="管理员密码"
    autocomplete="current-password"
  >


  <button
    class="login-btn"
    onclick="login()"
  >
    登录后台
  </button>


  <div
    id="loginError"
    class="login-error"
  >
  </div>

</div>

  </div>

  <!-- =====================
       管理后台
  ====================== -->

  <div
    id="adminPage"
    style="display: none;"
  >

<header
  class="header"
>

  <div
    class="header-inner"
  >

    <div>

      <div
        class="brand"
      >
        奕心疗愈舍 · 订单管理
      </div>


      <div
        class="subtitle"
      >
        YIXIN HEALING · APPOINTMENT SYSTEM
      </div>

    </div>


    <div
      class="header-actions"
    >

      <button
        class="refresh-btn"
        onclick="loadOrders()"
      >
        刷新订单
      </button>


      <button
        class="logout-btn"
        onclick="logout()"
      >
        退出登录
      </button>

    </div>

  </div>

</header>


<main
  class="container"
>


  <section
    class="stats"
  >

    <div
      class="stat-card"
    >

      <div
        class="stat-label"
      >
        总订单
      </div>


      <div
        class="stat-number"
        id="totalOrders"
      >
        0
      </div>

    </div>


    <div
      class="stat-card"
    >

      <div
        class="stat-label"
      >
        待确认
      </div>


      <div
        class="stat-number"
        id="pendingOrders"
      >
        0
      </div>

    </div>

  </section>


  <section
    class="table-card"
  >

    <div
      class="loading"
      id="loading"
    >
      正在加载订单...
    </div>


    <div
      class="empty"
      id="empty"
      style="display: none"
    >
      暂时还没有预约订单
    </div>


    <div
      class="table-wrap"
      id="tableWrap"
      style="display: none"
    >

      <table>

        <thead>

          <tr>

            <th>订单号</th>

            <th>服务</th>

            <th>价格</th>

            <th>时长</th>

            <th>疗愈师</th>

            <th>预约时间</th>

            <th>客户</th>

            <th>手机号</th>

            <th>服务地址</th>

            <th>状态</th>

            <th>下单时间</th>

          </tr>

        </thead>


        <tbody
          id="ordersBody"
        >
        </tbody>

      </table>

    </div>

  </section>


</main>

  </div>

  <script>


    async function login() {

      const username =
        document
          .getElementById(
            "username"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      const loginError =
        document.getElementById(
          "loginError"
        );


      loginError.textContent =
        "";


      if (
        !username ||
        !password
      ) {

        loginError.textContent =
          "请输入管理员账号和密码";

        return;

      }


      try {

        const response =
          await fetch(
            "/api/admin/login",
            {
              method:
                "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(
                  {
                    username,
                    password
                  }
                )
            }
          );


        const data =
          await response.json();


        if (
          !data.success
        ) {

          loginError.textContent =
            data.message ||
            "账号或密码错误";

          return;

        }


        localStorage.setItem(
          "adminToken",
          data.token
        );


        showAdminPage();


        loadOrders();

      } catch (
        error
      ) {

        console.error(
          error
        );


        loginError.textContent =
          "登录失败，请检查网络";

      }

    }


    function showAdminPage() {

      document
        .getElementById(
          "loginPage"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "adminPage"
        )
        .style.display =
          "block";

    }


    function showLoginPage() {

      document
        .getElementById(
          "adminPage"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "loginPage"
        )
        .style.display =
          "flex";

    }


    function logout() {

      localStorage.removeItem(
        "adminToken"
      );


      document
        .getElementById(
          "username"
        )
        .value =
          "";


      document
        .getElementById(
          "password"
        )
        .value =
          "";


      document
        .getElementById(
          "loginError"
        )
        .textContent =
          "";


      showLoginPage();

    }


    async function loadOrders() {

      const loading =
        document.getElementById(
          "loading"
        );


      const empty =
        document.getElementById(
          "empty"
        );


      const tableWrap =
        document.getElementById(
          "tableWrap"
        );


      const ordersBody =
        document.getElementById(
          "ordersBody"
        );


      const token =
        localStorage.getItem(
          "adminToken"
        );


      if (
        !token
      ) {

        showLoginPage();

        return;

      }


      loading.style.display =
        "block";


      loading.textContent =
        "正在加载订单...";


      empty.style.display =
        "none";


      tableWrap.style.display =
        "none";


      try {

        const response =
          await fetch(
            "/api/orders",
            {
              headers: {
                Authorization:
                  "Bearer " + token
              }
            }
          );


        if (
          response.status ===
          401
        ) {

          localStorage.removeItem(
            "adminToken"
          );


          showLoginPage();


          return;

        }


        const data =
          await response.json();


        if (
          !data.success
        ) {

          throw new Error(
            data.message ||
            "获取订单失败"
          );

        }


        const orders =
          data.orders || [];


        document
          .getElementById(
            "totalOrders"
          )
          .textContent =
            orders.length;


        document
          .getElementById(
            "pendingOrders"
          )
          .textContent =
            orders.filter(
              order =>
                order.status ===
                "待确认"
            ).length;


        ordersBody.innerHTML =
          "";


        loading.style.display =
          "none";


        if (
          orders.length ===
          0
        ) {

          empty.style.display =
            "block";

          return;

        }


        tableWrap.style.display =
          "block";


        orders.forEach(
          order => {

            const row =
              document.createElement(
                "tr"
              );


            const createdAt =
              order.createdAt
                ? new Date(
                    order.createdAt
                  ).toLocaleString(
                    "zh-CN"
                  )
                : "-";


            row.innerHTML =
              "<td>" +
              escapeHtml(
                order.id || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.service || "-"
              ) +
              "</td>" +

              "<td>¥" +
              escapeHtml(
                String(
                  order.price || 0
                )
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.duration || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.therapist || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.date || "-"
              ) +
              "<br>" +
              escapeHtml(
                order.time || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.name || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.phone || "-"
              ) +
              "</td>" +

              "<td>" +
              escapeHtml(
                order.address || "-"
              ) +
              "</td>" +

              "<td>" +
"<select " +
"class="status-select" " +
"data-order-id="" +
escapeHtml(order.id) +
"" " +
"onchange="updateOrderStatus(this)">" +

"<option value="待确认"" +
((order.status === "待确认")
? " selected"
: "") +
">待确认</option>" +

"<option value="已确认"" +
((order.status === "已确认")
? " selected"
: "") +
">已确认</option>" +

"<option value="服务中"" +
((order.status === "服务中")
? " selected"
: "") +
">服务中</option>" +

"<option value="已完成"" +
((order.status === "已完成")
? " selected"
: "") +
">已完成</option>" +

"<option value="已取消"" +
((order.status === "已取消")
? " selected"
: "") +
">已取消</option>" +

"</select>" +
"</td>" +


              "<td>" +
              escapeHtml(
                createdAt
              ) +
              "</td>";


            ordersBody.appendChild(
              row
            );

          }
        );

      } catch (
        error
      ) {

        console.error(
          error
        );


        loading.textContent =
          "订单加载失败，请刷新重试";

      }

    }

async function updateOrderStatus(
selectElement
) {

const orderId =
selectElement.dataset.orderId;

const status =
selectElement.value;

const token =
localStorage.getItem(
"adminToken"
);

selectElement.disabled =
true;

try {

```
const response =
  await fetch(
    "/api/orders/" +
    encodeURIComponent(
      orderId
    ) +
    "/status",
    {
      method:
        "PATCH",

      headers: {
        "Content-Type":
          "application/json",

        Authorization:
          "Bearer " + token
      },

      body:
        JSON.stringify({
          status
        })
    }
  );


const data =
  await response.json();


if (
  response.status ===
  401
) {

  localStorage.removeItem(
    "adminToken"
  );


  showLoginPage();


  return;

}


if (
  !data.success
) {

  throw new Error(
    data.message ||
    "修改失败"
  );

}


alert(
  "订单状态已更新为：" +
  status
);


loadOrders();
```

} catch (
error
) {

```
console.error(
  error
);


alert(
  "订单状态修改失败：" +
  error.message
);


loadOrders();
```

} finally {

```
selectElement.disabled =
  false;
```

}

}

    function escapeHtml(value) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        value;


      return div.innerHTML;

    }


    document
      .getElementById(
        "password"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter"
          ) {

            login();

          }

        }
      );


    const token =
      localStorage.getItem(
        "adminToken"
      );


    if (
      token
    ) {

      showAdminPage();

      loadOrders();

    }


  </script>

</body>
</html>
