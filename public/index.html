<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>奕心疗愈舍｜预约</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7f4ef;
      color: #292621;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 30px 18px 50px;
    }

    /* 顶部品牌 */
    .brand {
      text-align: center;
      padding: 12px 0 28px;
    }

    .brand-name {
      font-family:
        "Songti SC",
        "STSong",
        "SimSun",
        serif;
      font-size: 30px;
      letter-spacing: 8px;
      margin-left: 8px;
      font-weight: 500;
      color: #292621;
    }

    .brand-line {
      width: 36px;
      height: 1px;
      background: #b49a72;
      margin: 16px auto 13px;
    }

    .brand-slogan {
      font-size: 13px;
      letter-spacing: 3px;
      color: #8a8176;
    }

    /* 卡片 */
    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 15px;
      border: 1px solid rgba(65, 55, 45, 0.06);
      box-shadow: 0 8px 30px rgba(75, 63, 48, 0.045);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
    }

    .section-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #eee8de;
      color: #8b7556;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .section-desc {
      margin: -9px 0 17px 33px;
      color: #a0988d;
      font-size: 12px;
    }

    /* 服务选择 */
    .service-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service-item {
      position: relative;
      padding: 18px 15px;
      border: 1px solid #e5dfd5;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .service-item:hover {
      border-color: #cdbb9d;
    }

    .service-item.active {
      border-color: #b49a72;
      background: #fbf8f3;
      box-shadow: inset 0 0 0 1px rgba(180, 154, 114, 0.12);
    }

    .service-item.active::after {
      content: "✓";
      position: absolute;
      right: 12px;
      top: 11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #b49a72;
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .service-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .service-time {
      font-size: 12px;
      color: #958d83;
      margin-bottom: 11px;
    }

    .service-price {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
      color: #876e4d;
    }

    .service-price span {
      font-family: inherit;
      font-size: 12px;
      margin-left: 2px;
    }

    /* 表单 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #625b53;
      margin-bottom: 8px;
    }

    .required {
      color: #b28c61;
      margin-left: 3px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #e3ddd3;
      background: #fcfbf9;
      border-radius: 11px;
      min-height: 48px;
      padding: 0 14px;
      outline: none;
      color: #302d29;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      min-height: 82px;
      padding: 13px 14px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #c5aa82;
      box-shadow: 0 0 0 3px rgba(197, 170, 130, 0.10);
      background: #fff;
    }

    input::placeholder,
    textarea::placeholder {
      color: #b7b0a8;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 日期 */
    .date-tip {
      font-size: 11px;
      color: #a39a90;
      margin-top: 7px;
    }

    /* 时间按钮 */
    .time-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .time-option {
      min-height: 44px;
      border: 1px solid #e4ddd3;
      border-radius: 10px;
      background: #fff;
      color: #5c554d;
      cursor: pointer;
      transition: all 0.2s;
    }

    .time-option:hover {
      border-color: #cbb28e;
    }

    .time-option.active {
      background: #b49a72;
      border-color: #b49a72;
      color: #fff;
    }

    .time-option.disabled {
      color: #c9c3bc;
      background: #f7f5f2;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .empty-tip {
      padding: 15px;
      text-align: center;
      background: #f8f5f0;
      border-radius: 10px;
      color: #a49b90;
      font-size: 13px;
    }

    /* 预约摘要 */
    .summary {
      background: #f8f5ef;
      border-radius: 13px;
      padding: 17px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 13px;
    }

    .summary-row .label {
      color: #938a80;
    }

    .summary-row .value {
      color: #3d3832;
      text-align: right;
      max-width: 65%;
    }

    .summary-price {
      margin-top: 10px;
      padding-top: 13px;
      border-top: 1px solid #e4ddd3;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-price span:first-child {
      color: #71695f;
      font-size: 13px;
    }

    .price-number {
      color: #876e4d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
    }

    /* 提交 */
    .submit-btn {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 13px;
      background: #403b35;
      color: #fff;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 3px;
    }

    .submit-btn:hover {
      background: #514a42;
    }

    .submit-btn:active {
      transform: scale(0.985);
    }

    .submit-btn:disabled {
      background: #b8b1a8;
      cursor: not-allowed;
    }

    .notice {
      text-align: center;
      color: #a29a91;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 14px;
    }

    .loading {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 弹窗 */
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(32, 29, 25, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 23px 22px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
    }

    .modal-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #eee7dc;
      color: #9a805d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .modal h3 {
      margin: 0 0 9px;
      font-size: 19px;
    }

    .modal p {
      margin: 0;
      color: #817970;
      font-size: 13px;
      line-height: 1.8;
    }

    .modal-btn {
      width: 100%;
      height: 45px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #403b35;
      color: #fff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .page {
        padding: 22px 14px 40px;
      }

      .brand {
        padding-bottom: 23px;
      }

      .brand-name {
        font-size: 27px;
      }

      .card {
        padding: 18px;
        border-radius: 16px;
      }

      .service-list {
        gap: 9px;
      }

      .service-item {
        padding: 15px 12px;
      }

      .service-price {
        font-size: 22px;
      }

      .time-box {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- 品牌 -->
  <header class="brand">
    <div class="brand-name">奕心疗愈舍</div>
    <div class="brand-line"></div>
    <div class="brand-slogan">身心同调 · 医心疗愈 · 回归本真</div>
  </header>

  <!-- 服务 -->
  <section class="card">
    <div class="section-title">
      <div class="section-number">01</div>
      <h2>选择疗愈服务</h2>
    </div>

    <div class="section-desc">选择适合自己的疗愈时长</div>

    <div class="service-list">

      <div class="service-item active"
           data-service="舒缓疗愈"
           data-price="298"
           data-duration="90">
        <div class="service-name">舒缓疗愈</div>
        <div class="service-time">90分钟 · 深度放松</div>
        <div class="service-price">298<span>元</span></div>
      </div>

      <div class="service-item"
           data-service="深度疗愈"
           data-price="398"
           data-duration="120">
        <div class="service-name">深度疗愈</div>
        <div class="service-time">120分钟 · 深度舒缓</div>
        <div class="service-price">398<span>元</span></div>
      </div>

    </div>
  </section>

  <!-- 时间 -->
  <section class="card">

    <div class="section-title">
      <div class="section-number">02</div>
      <h2>选择预约时间</h2>
    </div>

    <div class="two-col">

      <div class="form-group">
        <label class="form-label">预约日期<span class="required">*</span></label>
        <input id="date" type="date">
        <div class="date-tip">请选择需要到店/上门服务的日期</div>
      </div>

      <div class="form-group">
        <label class="form-label">疗愈师<span class="required">*</span></label>
        <select id="therapist">
          <option value="">请选择疗愈师</option>
        </select>
      </div>

    </div>

    <div class="form-group">
      <label class="form-label">可预约时间<span class="required">*</span></label>
      <div id="timeBox" class="time-box">
        <div class="empty-tip" style="grid-column:1/-1;">
          请先选择日期和疗愈师
        </div>
      </div>
    </div>

  </section>

  <!-- 个人信息 -->
  <section class="card">

    <div class="section-title">
      <div class="section-number">03</div>
      <h2>填写预约信息</h2>
    </div>

    <div class="section-desc">我们会根据您填写的信息与您确认预约</div>

    <div class="form-group">
      <label class="form-label">姓名<span class="required">*</span></label>
      <input
        id="customerName"
        type="text"
        maxlength="30"
        placeholder="请输入您的姓名"
      >
    </div>

    <div class="form-group">
      <label class="form-label">手机号码<span class="required">*</span></label>
      <input
        id="phone"
        type="tel"
        inputmode="numeric"
        maxlength="11"
        placeholder="请输入11位手机号码"
      >
    </div>

    <div class="form-group">
      <label class="form-label">服务地址<span class="required">*</span></label>
      <textarea
        id="address"
        maxlength="200"
        placeholder="请输入详细服务地址"
      ></textarea>
    </div>

  </section>

  <!-- 预约确认 -->
  <section class="card">

    <div class="section-title">
      <div class="section-number">04</div>
      <h2>预约确认</h2>
    </div>

    <div class="summary">

      <div class="summary-row">
        <span class="label">服务项目</span>
        <span class="value" id="summaryService">舒缓疗愈</span>
      </div>

      <div class="summary-row">
        <span class="label">服务时长</span>
        <span class="value" id="summaryDuration">90分钟</span>
      </div>

      <div class="summary-row">
        <span class="label">预约日期</span>
        <span class="value" id="summaryDate">—</span>
      </div>

      <div class="summary-row">
        <span class="label">疗愈师</span>
        <span class="value" id="summaryTherapist">—</span>
      </div>

      <div class="summary-row">
        <span class="label">预约时间</span>
        <span class="value" id="summaryTime">—</span>
      </div>

      <div class="summary-price">
        <span>预约金额</span>
        <span class="price-number">¥<span id="summaryPrice">298</span></span>
      </div>

    </div>

    <button id="submitBtn" class="submit-btn">
      确认预约
    </button>

    <div class="notice">
      提交预约后，我们会尽快与您联系确认<br>
      您的个人信息仅用于本次预约服务
    </div>

  </section>

</div>

<!-- 弹窗 -->
<div id="modalMask" class="modal-mask">
  <div class="modal">
    <div class="modal-icon" id="modalIcon">✓</div>
    <h3 id="modalTitle">预约成功</h3>
    <p id="modalText">您的预约已提交，我们会尽快与您联系确认。</p>
    <button class="modal-btn" onclick="closeModal()">知道了</button>
  </div>
</div>


<script>
  const state = {
    service: "舒缓疗愈",
    price: 298,
    duration: 90,
    date: "",
    therapistId: "",
    therapistName: "",
    time: ""
  };

  const serviceItems = document.querySelectorAll(".service-item");
  const dateInput = document.getElementById("date");
  const therapistSelect = document.getElementById("therapist");
  const timeBox = document.getElementById("timeBox");

  const customerName = document.getElementById("customerName");
  const phone = document.getElementById("phone");
  const address = document.getElementById("address");

  const summaryService = document.getElementById("summaryService");
  const summaryDuration = document.getElementById("summaryDuration");
  const summaryDate = document.getElementById("summaryDate");
  const summaryTherapist = document.getElementById("summaryTherapist");
  const summaryTime = document.getElementById("summaryTime");
  const summaryPrice = document.getElementById("summaryPrice");

  const submitBtn = document.getElementById("submitBtn");

  function todayString() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDate(date) {
    if (!date) return "—";

    const parts = date.split("-");
    if (parts.length !== 3) return date;

    return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;
  }

  function showModal(title, text, success = true) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalText").textContent = text;
    document.getElementById("modalIcon").textContent = success ? "✓" : "!";
    document.getElementById("modalMask").classList.add("show");
  }

  function closeModal() {
    document.getElementById("modalMask").classList.remove("show");
  }

  function updateSummary() {
    summaryService.textContent = state.service || "—";
    summaryDuration.textContent = state.duration ? `${state.duration}分钟` : "—";
    summaryDate.textContent = formatDate(state.date);
    summaryTherapist.textContent = state.therapistName || "—";
    summaryTime.textContent = state.time || "—";
    summaryPrice.textContent = state.price || "0";
  }

  // 服务选择
  serviceItems.forEach(item => {
    item.addEventListener("click", () => {

      serviceItems.forEach(x => x.classList.remove("active"));
      item.classList.add("active");

      state.service = item.dataset.service;
      state.price = Number(item.dataset.price);
      state.duration = Number(item.dataset.duration);

      state.time = "";
      renderTime([]);

      updateSummary();

      if (state.date && state.therapistId) {
        loadAvailableSlots();
      }
    });
  });

  // 设置日期
  function initDate() {
    const today = todayString();

    dateInput.min = today;
    dateInput.value = today;

    state.date = today;
  }

  // 加载疗愈师
  async function loadTherapists() {

    therapistSelect.innerHTML =
      '<option value="">正在加载疗愈师...</option>';

    try {

      const res = await fetch(
        `/api/available-therapists?date=${encodeURIComponent(state.date)}`
      );

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "获取疗愈师失败");
      }

      const list = Array.isArray(data)
        ? data
        : (data.therapists || data.data || []);

      therapistSelect.innerHTML =
        '<option value="">请选择疗愈师</option>';

      if (!list.length) {

        therapistSelect.innerHTML =
          '<option value="">当天暂无可预约疗愈师</option>';

        state.therapistId = "";
        state.therapistName = "";
        state.time = "";

        renderTime([]);

        updateSummary();

        return;
      }

      list.forEach(item => {

        const id = item.id ?? item.therapist_id;
        const name = item.name ?? item.therapist_name;

        const option = document.createElement("option");

        option.value = id;
        option.textContent = name;

        therapistSelect.appendChild(option);
      });

    } catch (err) {

      console.error(err);

      therapistSelect.innerHTML =
        '<option value="">加载失败，请刷新重试</option>';

      showModal(
        "获取信息失败",
        err.message || "暂时无法获取疗愈师信息，请稍后重试。",
        false
      );
    }
  }

  // 加载时间
  async function loadAvailableSlots() {

    if (!state.date || !state.therapistId) {
      renderTime([]);
      return;
    }

    timeBox.innerHTML =
      '<div class="empty-tip" style="grid-column:1/-1;">正在查询可预约时间...</div>';

    state.time = "";
    updateSummary();

    try {

      const url =
        `/api/available-slots` +
        `?therapistId=${encodeURIComponent(state.therapistId)}` +
        `&date=${encodeURIComponent(state.date)}` +
        `&duration=${encodeURIComponent(state.duration)}`;

      const res = await fetch(url);

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "获取时间失败");
      }

      const list = Array.isArray(data)
        ? data
        : (data.slots || data.data || []);

      renderTime(list);

    } catch (err) {

      console.error(err);

      timeBox.innerHTML =
        '<div class="empty-tip" style="grid-column:1/-1;">暂时无法获取时间，请稍后重试</div>';
    }
  }

  function renderTime(list) {

    timeBox.innerHTML = "";

    if (!list || !list.length) {

      timeBox.innerHTML =
        '<div class="empty-tip" style="grid-column:1/-1;">当天暂无可预约时间</div>';

      return;
    }

    list.forEach(item => {

      let value = "";
      let disabled = false;

      if (typeof item === "string") {

        value = item;

      } else {

        value =
          item.time ||
          item.start_time ||
          item.start ||
          item.value ||
          "";

        disabled =
          item.disabled === true ||
          item.available === false;
      }

      if (!value) return;

      const button = document.createElement("button");

      button.type = "button";
      button.className = "time-option";

      if (disabled) {
        button.classList.add("disabled");
        button.disabled = true;
      }

      button.textContent = value;

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".time-option")
          .forEach(x => x.classList.remove("active"));

        button.classList.add("active");

        state.time = value;

        updateSummary();
      });

      timeBox.appendChild(button);
    });
  }

  // 日期改变
  dateInput.addEventListener("change", async () => {

    state.date = dateInput.value;
    state.therapistId = "";
    state.therapistName = "";
    state.time = "";

    updateSummary();

    await loadTherapists();
    renderTime([]);
  });

  // 疗愈师改变
  therapistSelect.addEventListener("change", async () => {

    state.therapistId = therapistSelect.value;

    const selected =
      therapistSelect.options[therapistSelect.selectedIndex];

    state.therapistName =
      selected && selected.value
        ? selected.textContent
        : "";

    state.time = "";

    updateSummary();

    await loadAvailableSlots();
  });

  // 手机号只允许数字
  phone.addEventListener("input", () => {

    phone.value = phone.value
      .replace(/\D/g, "")
      .slice(0, 11);
  });

  // 提交预约
  submitBtn.addEventListener("click", async () => {

    const name = customerName.value.trim();
    const phoneNumber = phone.value.trim();
    const addressValue = address.value.trim();

    if (!state.service) {
      showModal("请选择服务", "请先选择您需要的疗愈服务。", false);
      return;
    }

    if (!state.date) {
      showModal("请选择日期", "请选择您的预约日期。", false);
      return;
    }

    if (!state.therapistId) {
      showModal("请选择疗愈师", "请选择一位可预约的疗愈师。", false);
      return;
    }

    if (!state.time) {
      showModal("请选择时间", "请选择一个可预约的时间段。", false);
      return;
    }

    if (!name) {
      showModal("请填写姓名", "请输入您的姓名后再提交预约。", false);
      customerName.focus();
      return;
    }

    if (!/^1[3-9]\d{9}$/.test(phoneNumber)) {
      showModal(
        "手机号格式有误",
        "请输入正确的11位手机号码。",
        false
      );
      phone.focus();
      return;
    }

    if (!addressValue) {
      showModal(
        "请填写服务地址",
        "请输入完整的服务地址。",
        false
      );
      address.focus();
      return;
    }

    submitBtn.disabled = true;

    submitBtn.innerHTML =
      '<span class="loading"></span>正在提交预约';

    try {

      const payload = {
        service: state.service,
        price: state.price,
        duration: state.duration,
        therapist: state.therapistName,
        therapistId: Number(state.therapistId),
        service_date: state.date,
        service_time: state.time,
        customer_name: name,
        phone: phoneNumber,
        address: addressValue
      };

      const res = await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(
          data.message ||
          data.error ||
          "预约提交失败"
        );
      }

      showModal(
        "预约成功",
        "您的预约已经提交成功，我们会尽快与您联系确认。",
        true
      );

      state.time = "";

      updateSummary();

      customerName.value = "";
      phone.value = "";
      address.value = "";

      await loadAvailableSlots();

    } catch (err) {

      console.error(err);

      showModal(
        "预约未成功",
        err.message ||
        "预约提交失败，请稍后重试。",
        false
      );

    } finally {

      submitBtn.disabled = false;
      submitBtn.textContent = "确认预约";
    }
  });

  // 初始化
  async function init() {

    initDate();

    updateSummary();

    await loadTherapists();
  }

  init();
</script>

</body>
</html>
