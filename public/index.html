<html lang="zh-CN">

<head>

  <title>奕心疗愈舍｜身心同调 · 医心疗愈 · 回归本真</title>



  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      -webkit-tap-highlight-color: transparent;

    }



    html {

      scroll-behavior: smooth;

    }



    body {

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "PingFang SC",

        "Hiragino Sans GB",

        "Microsoft YaHei",

        sans-serif;

      background: #f7f4ef;

      color: #292722;

      line-height: 1.6;

    }



    button,

    input {

      font: inherit;

    }



    button {

      cursor: pointer;

    }



    .page {

      width: 100%;

      max-width: 760px;

      margin: 0 auto;

      min-height: 100vh;

      background: #f7f4ef;

    }



    /* =========================

       顶部品牌

    ========================= */



    .brand {

      text-align: center;

      padding: 28px 20px 18px;

    }



    .brand-name {

      font-size: 29px;

      font-weight: 500;

      letter-spacing: 7px;

      color: #292722;

      margin-left: 7px;

    }



    .brand-slogan {

      margin-top: 8px;

      font-size: 11px;

      letter-spacing: 3px;

      color: #9a9288;

    }



    /* =========================

       Hero

    ========================= */



    .hero {

      position: relative;

      margin: 0 14px 22px;

      height: 300px;

      border-radius: 22px;

      overflow: hidden;

      background:

        linear-gradient(

          to bottom,

          rgba(0, 0, 0, 0.03),

          rgba(0, 0, 0, 0.18)

        ),

        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=85")

        center / cover no-repeat;

    }



    .hero::after {

      content: "";

      position: absolute;

      inset: 0;

      background: linear-gradient(

        to top,

        rgba(20, 18, 15, 0.42),

        rgba(20, 18, 15, 0.03) 65%

      );

    }



    .hero-content {

      position: absolute;

      z-index: 2;

      left: 24px;

      right: 24px;

      bottom: 24px;

      color: #fff;

    }



    .hero-title {

      font-size: 25px;

      font-weight: 400;

      letter-spacing: 3px;

    }



    .hero-subtitle {

      margin-top: 7px;

      font-size: 12px;

      letter-spacing: 2px;

      opacity: 0.9;

    }



    /* =========================

       主体

    ========================= */



    .content {

      padding: 0 14px 40px;

    }



    .section {

      margin-bottom: 18px;

    }



    .section-title {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 10px;

      padding: 0 4px;

    }



    .section-title h2 {

      font-size: 17px;

      font-weight: 500;

      letter-spacing: 1px;

    }



    .section-title span {

      font-size: 11px;

      color: #a39b91;

    }



    .card {

      background: rgba(255, 255, 255, 0.9);

      border: 1px solid rgba(80, 70, 60, 0.07);

      border-radius: 18px;

      padding: 16px;

      box-shadow: 0 5px 20px rgba(80, 70, 60, 0.04);

    }



    /* =========================

       服务项目

    ========================= */



    .service-list {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;

    }



    .service-card {

      position: relative;

      padding: 18px 15px;

      border: 1px solid #e7e1d8;

      border-radius: 15px;

      background: #fff;

      transition: 0.2s ease;

      text-align: left;

    }



    .service-card.active {

      border-color: #8d8377;

      background: #f9f6f1;

      box-shadow: inset 0 0 0 1px #8d8377;

    }



    .service-card:active {

      transform: scale(0.98);

    }



    .service-duration {

      font-size: 11px;

      color: #9a9288;

      margin-bottom: 5px;

    }



    .service-name {

      font-size: 16px;

      color: #2c2925;

      font-weight: 500;

    }



    .service-price {

      margin-top: 7px;

      color: #756b60;

      font-size: 18px;

      font-weight: 500;

    }



    .service-price small {

      font-size: 11px;

      font-weight: 400;

    }



    .service-check {

      position: absolute;

      top: 12px;

      right: 12px;

      width: 19px;

      height: 19px;

      border-radius: 50%;

      border: 1px solid #d6cec3;

    }



    .service-card.active .service-check {

      border-color: #6f665c;

      background: #6f665c;

    }



    .service-card.active .service-check::after {

      content: "";

      position: absolute;

      width: 7px;

      height: 4px;

      border-left: 1.5px solid #fff;

      border-bottom: 1.5px solid #fff;

      transform: rotate(-45deg);

      left: 5px;

      top: 5px;

    }



    /* =========================

       日期

    ========================= */



    .date-wrap {

      position: relative;

    }



    .date-input {

      width: 100%;

      height: 48px;

      border: 1px solid #e2dcd3;

      border-radius: 12px;

      background: #fff;

      padding: 0 14px;

      color: #39352f;

      outline: none;

    }



    .date-input:focus {

      border-color: #9b9185;

    }



    /* =========================

       疗愈师

    ========================= */



    .therapist-list {

      display: grid;

      gap: 10px;

    }



    .therapist-card {

      display: flex;

      align-items: center;

      gap: 13px;

      width: 100%;

      padding: 12px;

      background: #fff;

      border: 1px solid #e7e1d8;

      border-radius: 15px;

      text-align: left;

      transition: 0.2s ease;

    }



    .therapist-card.active {

      border-color: #8d8377;

      background: #faf8f4;

      box-shadow: inset 0 0 0 1px #8d8377;

    }



    .therapist-card:active {

      transform: scale(0.99);

    }



    .therapist-avatar {

      width: 68px;

      height: 68px;

      flex: 0 0 68px;

      border-radius: 50%;

      object-fit: cover;

      background: #eee8df;

    }



    .therapist-info {

      min-width: 0;

      flex: 1;

    }



    .therapist-name-row {

      display: flex;

      align-items: center;

      gap: 8px;

    }



    .therapist-name {

      font-size: 16px;

      font-weight: 500;

      color: #2f2b26;

    }



    .therapist-years {

      font-size: 10px;

      color: #9b9288;

      padding: 2px 7px;

      border: 1px solid #e1dad1;

      border-radius: 20px;

    }



    .therapist-intro {

      margin-top: 4px;

      color: #7e766d;

      font-size: 11px;

      line-height: 1.5;

    }



    .therapist-tags {

      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      margin-top: 6px;

    }



    .therapist-tag {

      font-size: 9px;

      color: #8b8176;

      background: #f4f0ea;

      padding: 3px 7px;

      border-radius: 20px;

    }



    .therapist-arrow {

      color: #b4aba1;

      font-size: 20px;

      padding-left: 3px;

    }



    .empty {

      padding: 24px 10px;

      text-align: center;

      color: #aaa198;

      font-size: 12px;

    }



    /* =========================

       时间

    ========================= */



    .time-list {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 8px;

    }



    .time-btn {

      height: 40px;

      border: 1px solid #e4ddd4;

      border-radius: 10px;

      background: #fff;

      color: #575047;

      font-size: 12px;

      transition: 0.2s ease;

    }



    .time-btn.active {

      background: #746b61;

      color: #fff;

      border-color: #746b61;

    }



    .time-btn:active {

      transform: scale(0.97);

    }



    /* =========================

       表单

    ========================= */



    .form-group {

      margin-bottom: 12px;

    }



    .form-group:last-child {

      margin-bottom: 0;

    }



    .form-label {

      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      color: #6e665d;

    }



    .form-input {

      width: 100%;

      height: 46px;

      border: 1px solid #e3ddd5;

      border-radius: 11px;

      background: #fff;

      padding: 0 13px;

      color: #36322d;

    }



    .form-input:focus {

      border-color: #9b9185;

    }



    .form-input::placeholder {

      color: #b7afa6;

    }



    /* =========================

       订单摘要

    ========================= */



    .summary {

      background: #f4f0e9;

      border-radius: 13px;

      padding: 14px;

    }



    .summary-row {

      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 6px 0;

      font-size: 12px;

    }



    .summary-row span:first-child {

      color: #91887e;

    }



    .summary-row span:last-child {

      color: #443f39;

      text-align: right;

    }



    .summary-price {

      font-size: 18px !important;

      font-weight: 500;

    }



    /* =========================

       提交按钮

    ========================= */



    .submit-btn {

      width: 100%;

      height: 52px;

      margin-top: 15px;

      border: 0;

      border-radius: 15px;

      background: #403b35;

      color: #fff;

      font-size: 15px;

      letter-spacing: 2px;

      transition: 0.2s ease;

      box-shadow: 0 8px 22px rgba(60, 54, 48, 0.14);

    }



    .submit-btn:active {

      transform: translateY(1px);

      opacity: 0.9;

    }



    .submit-btn:disabled {

      background: #bdb5ac;

      box-shadow: none;

      cursor: not-allowed;

    }



    .footer {

      padding: 10px 20px 30px;

      text-align: center;

      color: #aaa198;

      font-size: 10px;

      letter-spacing: 1px;

    }



    /* =========================

       Modal

    ========================= */



    .modal {

      position: fixed;

      inset: 0;

      z-index: 999;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background: rgba(30, 27, 24, 0.42);

    }



    .modal.show {

      display: flex;

    }



    .modal-box {

      width: 100%;

      max-width: 400px;

      background: #fff;

      border-radius: 20px;

      padding: 27px 22px 22px;

      text-align: center;

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);

    }



    .modal-icon {

      width: 52px;

      height: 52px;

      margin: 0 auto 13px;

      border-radius: 50%;

      background: #f1ece5;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

    }



    .modal-title {

      font-size: 19px;

      font-weight: 500;

      color: #332f2a;

    }



    .modal-text {

      margin-top: 9px;

      font-size: 12px;

      color: #8a8178;

      line-height: 1.8;

    }



    .modal-btn {

      width: 100%;

      height: 44px;

      margin-top: 18px;

      border: 0;

      border-radius: 11px;

      background: #403b35;

      color: #fff;

      font-size: 13px;

    }



    /* =========================

       Loading

    ========================= */



    .loading {

      padding: 20px;

      text-align: center;

      color: #aaa198;

      font-size: 12px;

    }



    .error {

      padding: 18px;

      text-align: center;

      color: #a17768;

      font-size: 12px;

      background: #faf4f1;

      border-radius: 12px;

    }



    /* =========================

       手机端

    ========================= */



    @media (max-width: 420px) {

      .brand {

        padding-top: 24px;

      }



      .brand-name {

        font-size: 26px;

      }



      .hero {

        height: 270px;

      }

      }

        grid-template-columns: repeat(4, 1fr);

      }



      .therapist-avatar {

        width: 62px;

        height: 62px;

        flex-basis: 62px;

      }

    }

  </style>

</head>

  <script>

    /* =====================================================

       奕心疗愈舍 V1.0

       客户预约前端

    ===================================================== */



    const $ = (selector) => document.querySelector(selector);



    const API = "";



    /* =========================

       默认疗愈师资料

    ========================= */



    const therapistProfiles = {

      "安然": {

        years: "6年经验",

        intro: "专注身体舒缓与深度放松，服务风格细腻温和。",

        tags: ["轻柔舒缓", "压力释放", "情绪放松"],

      "静宜": {

        tags: ["轻享放松", "身心舒缓", "睡眠放松"],

        image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=85"

    };



    const defaultProfile = {

      years: "专业疗愈师",

      intro: "以细致、专业的服务，为您带来安静舒适的疗愈体验。",

      tags: ["身心放松", "身体舒缓", "静心疗愈"],

      image: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=700&q=85"

    };



    /* =========================

       当前状态

    ========================= */



    const state = {

      service: "轻享疗愈",

      price: 298,

      duration: 90,



      date: "",

      therapistId: "",

      therapistName: "",

      time: ""

    };



    /* =========================

       初始化

    ========================= */



    document.addEventListener("DOMContentLoaded", () => {



      initDate();



      bindServiceEvents();



      bindDateEvent();



      bindSubmitEvent();



      loadTherapists();



      updateSummary();

    });



    /* =========================

       日期初始化

    ========================= */



    function initDate() {



      const dateInput = $("#dateInput");



      if (!dateInput) return;



      const today = new Date();



      const yyyy = today.getFullYear();



      const mm = String(today.getMonth() + 1).padStart(2, "0");



      const dd = String(today.getDate()).padStart(2, "0");



      const todayString = `${yyyy}-${mm}-${dd}`;



      dateInput.min = todayString;



      dateInput.value = todayString;



      state.date = todayString;



      updateSummary();

    }



    /* =========================

       服务项目

    ========================= */



    function bindServiceEvents() {



      const cards = document.querySelectorAll(".service-card");



      cards.forEach((card) => {



        card.addEventListener("click", () => {



          cards.forEach((item) => {

            item.classList.remove("active");

          });



          card.classList.add("active");



          state.service = card.dataset.service;



          state.price = Number(card.dataset.price);



          state.duration = Number(card.dataset.duration);



          state.time = "";



          updateSummary();



          if (state.date && state.therapistId) {

            loadTimeSlots();

          }

        });

      });

    }



    /* =========================

       日期

    ========================= */



    function bindDateEvent() {



      const dateInput = $("#dateInput");



      if (!dateInput) return;



      dateInput.addEventListener("change", () => {



        state.date = dateInput.value;



        state.therapistId = "";



        state.therapistName = "";



        state.time = "";



        updateSummary();



        loadTherapists();



        renderEmptyTime();

      });

    }



    /* =========================

       获取疗愈师

    ========================= */



    async function loadTherapists() {



      const container = $("#therapistList");



      if (!container) return;



      container.innerHTML =

        '<div class="loading">正在加载疗愈师...</div>';



      try {



        if (!state.date) {

          container.innerHTML =

            '<div class="empty">请先选择日期</div>';

          return;

        }



        const response = await fetch(

          `${API}/api/available-therapists?date=${encodeURIComponent(state.date)}`

        );



        const data = await response.json();



        if (!response.ok) {

          throw new Error(

            data.message || "获取疗愈师失败"

          );

        }



        const therapists =

          Array.isArray(data)

            ? data

            : Array.isArray(data.therapists)

              ? data.therapists

              : [];



        renderTherapists(therapists);



      } catch (error) {



        console.error(error);



        container.innerHTML = `

          <div class="error">

            暂时无法获取疗愈师信息，请稍后再试

          </div>

        `;

      }

    }



    /* =========================

       渲染疗愈师

    ========================= */



    function renderTherapists(therapists) {



      const container = $("#therapistList");



      if (!container) return;



      if (!therapists.length) {



        container.innerHTML = `

          <div class="empty">

            当前日期暂无可预约疗愈师

          </div>

        `;



        return;

      }



      container.innerHTML = "";



      therapists.forEach((item) => {



        const id =

          item.id ??

          item.therapist_id ??

          item.therapistId;



        const name =

          item.name ??

          item.therapist ??

          item.therapist_name ??

          "";



        const profile =

          therapistProfiles[name] || defaultProfile;



        const image =

          item.avatar ||

          item.image ||

          profile.image;



        const years =

          item.years ||

          item.experience ||

          profile.years;



        const intro =

          item.intro ||

          item.specialty ||

          item.description ||

          profile.intro;



        const tags =

          Array.isArray(item.tags)

            ? item.tags

            : profile.tags;



        const card = document.createElement("button");



        card.type = "button";



        card.className = "therapist-card";



        card.innerHTML = `

          <img

            class="therapist-avatar"

            src="${escapeHtml(image)}"

            alt="${escapeHtml(name)}"

            onerror="this.src='${defaultProfile.image}'"

          >



          <div class="therapist-info">



            <div class="therapist-name-row">



              <div class="therapist-name">

                ${escapeHtml(name)}

              </div>



              <div class="therapist-years">

                ${escapeHtml(years)}

              </div>



            </div>



            <div class="therapist-intro">

              ${escapeHtml(intro)}

            </div>



            <div class="therapist-tags">



              ${tags

                .map(

                  (tag) => `

                    <span class="therapist-tag">

                      ${escapeHtml(tag)}

                    </span>

                  `

                )

                .join("")}



            </div>



          </div>



          <div class="therapist-arrow">

            ›

          </div>

        `;



        card.addEventListener("click", () => {



          document

            .querySelectorAll(".therapist-card")

            .forEach((item) => {

              item.classList.remove("active");

            });



          card.classList.add("active");



          state.therapistId = id;



          state.therapistName = name;



          state.time = "";



          updateSummary();



          loadTimeSlots();

        });



        container.appendChild(card);

      });

    }



    /* =========================

       获取可预约时间

    ========================= */



    async function loadTimeSlots() {



      const container = $("#timeList");



      if (!container) return;



      if (!state.date || !state.therapistId) {



        renderEmptyTime();



        return;

      }



      container.innerHTML =

        '<div class="loading" style="grid-column:1/-1;">正在查询可预约时间...</div>';



      try {



        const url =

          `${API}/api/available-slots` +

          `?therapistId=${encodeURIComponent(state.therapistId)}` +

          `&date=${encodeURIComponent(state.date)}` +

          `&duration=${encodeURIComponent(state.duration)}`;



        const response = await fetch(url);



        const data = await response.json();



        if (!response.ok) {

          throw new Error(

            data.message || "获取时间失败"

          );

        }



        const slots =

          Array.isArray(data)

            ? data

            : Array.isArray(data.slots)

              ? data.slots

              : [];



        renderTimeSlots(slots);



      } catch (error) {



        console.error(error);



        container.innerHTML = `

          <div

            class="error"

            style="grid-column:1/-1;"

          >

            暂时无法获取可预约时间，请稍后再试

          </div>

        `;

      }

    }



    /* =========================

       渲染时间

    ========================= */



    function renderTimeSlots(slots) {



      const container = $("#timeList");



      if (!container) return;



      if (!slots.length) {



        container.innerHTML = `

          <div

            class="empty"

            style="grid-column:1/-1;"

          >

            当天暂无可预约时间

          </div>

        `;



        state.time = "";



        updateSummary();



        return;

      }



      container.innerHTML = "";



      slots.forEach((slot) => {



        let time = "";



        if (typeof slot === "string") {



          time = slot;



        } else {



          time =

            slot.time ||

            slot.start_time ||

            slot.startTime ||

            "";

        }



        if (!time) return;



        const button =

          document.createElement("button");



        button.type = "button";



        button.className = "time-btn";



        button.textContent = formatTime(time);



        button.addEventListener("click", () => {



          document

            .querySelectorAll(".time-btn")

            .forEach((item) => {

              item.classList.remove("active");

            });



          button.classList.add("active");



          state.time = time;



          updateSummary();

        });



        container.appendChild(button);

      });



      if (!container.children.length) {



        container.innerHTML = `

          <div

            class="empty"

            style="grid-column:1/-1;"

          >

            暂无可预约时间

          </div>

        `;

      }

    }



    /* =========================

       空时间

    ========================= */



    function renderEmptyTime() {



      const container = $("#timeList");



      if (!container) return;



      container.innerHTML = `

        <div

          class="empty"

          style="grid-column:1/-1;"

        >

          请先选择日期和疗愈师

        </div>

      `;

    }



    /* =========================

       更新摘要

    ========================= */



    function updateSummary() {



      const service =

        $("#summaryService");



      const duration =

        $("#summaryDuration");



      const date =

        $("#summaryDate");



      const therapist =

        $("#summaryTherapist");



      const time =

        $("#summaryTime");



      const price =

        $("#summaryPrice");



      if (service) {

        service.textContent =

          state.service || "请选择";

      }



      if (duration) {

        duration.textContent =

          state.duration

            ? `${state.duration} 分钟`

            : "请选择";

      }



      if (date) {

        date.textContent =

          state.date

            ? formatDate(state.date)

            : "请选择";

      }



      if (therapist) {

        therapist.textContent =

          state.therapistName || "请选择";

      }



      if (time) {

        time.textContent =

          state.time

            ? formatTime(state.time)

            : "请选择";

      }



      if (price) {

        price.textContent =

          state.price

            ? `¥${state.price}`

            : "¥0";

      }

    }



    /* =========================

       提交预约

    ========================= */



    function bindSubmitEvent() {



      const button = $("#submitBtn");



      if (!button) return;



      button.addEventListener("click", submitOrder);

    }



    async function submitOrder() {



      const nameInput =

        $("#nameInput");



      const phoneInput =

        $("#phoneInput");



      const addressInput =

        $("#addressInput");



      const button =

        $("#submitBtn");



      const name =

        nameInput.value.trim();



      const phoneNumber =

        phoneInput.value.trim();



      const addressValue =

        addressInput.value.trim();



      /* ---------- 基础验证 ---------- */



      if (!state.service) {

        showError("请选择疗愈项目");

        return;

      }



      if (!state.date) {

        showError("请选择预约日期");

        return;

      }



      if (!state.therapistId) {

        showError("请选择疗愈师");

        return;

      }



      if (!state.time) {

        showError("请选择预约时间");

        return;

      }



      if (!name) {

        showError("请输入您的姓名");

        nameInput.focus();

        return;

      }



      if (!/^1[3-9]\d{9}$/.test(phoneNumber)) {

        showError("请输入正确的11位手机号");

        phoneInput.focus();

        return;

      }



      if (!addressValue) {

        showError("请输入服务地址");

        addressInput.focus();

        return;

      }



      /* ---------- 防止重复点击 ---------- */



      button.disabled = true;



      button.textContent =

        "正在提交预约…";



      try {



        /* ---------- 与后端 server.js 对接 ---------- */



        const payload = {

          service: state.service,

          price: state.price,

          duration: state.duration,



          therapist: state.therapistName,

          therapistId: Number(state.therapistId),



          service_date: state.date,

          service_time: state.time,



          customer_name: name,

          phone: phoneNumber,

          address: addressValue

        };



        console.log(

          "提交预约：",

          payload

        );



        const response =

          await fetch(

            `${API}/api/orders`,

            {

              method: "POST",



              headers: {

                "Content-Type":

                  "application/json"

              },



              body:

                JSON.stringify(payload)

            }

          );



        let data = {};



        try {

          data = await response.json();

        } catch {

          data = {};

        }



        if (!response.ok) {



          throw new Error(

            data.message ||

            data.error ||

            "预约提交失败，请稍后再试"

          );

        }



        /* ---------- 成功 ---------- */



        const orderId =

          data.id ||

          data.order_id ||

          data.orderId ||

          "";



        let successMessage =

          `您的 ${state.service} 已预约成功。`;



        if (orderId) {

          successMessage +=

            `<br>预约编号：${escapeHtml(String(orderId))}`;

        }



        successMessage +=

          `<br>${escapeHtml(formatDate(state.date))} ${escapeHtml(formatTime(state.time))}`;



        successMessage +=

          `<br>${escapeHtml(state.therapistName)} 为您服务`;



        $("#successText").innerHTML =

          successMessage;



        $("#successModal")

          .classList

          .add("show");



        /* ---------- 清理当前选择 ---------- */



        state.time = "";



        updateSummary();



        renderEmptyTime();



      } catch (error) {



        console.error(

          "预约提交失败：",

          error

        );



        showError(

          error.message ||

          "预约提交失败，请稍后再试"

        );



      } finally {



        button.disabled = false;



        button.textContent =

          "确认预约";

      }

    }



    /* =========================

       错误提示

    ========================= */



    function showError(message) {



      alert(message);

    }



    /* =========================

       关闭弹窗

    ========================= */



    function closeModal() {



      const modal =

        $("#successModal");



      if (modal) {

        modal.classList.remove("show");

      }

    }



    window.closeModal =

      closeModal;



    /* 点击遮罩关闭 */

    $("#successModal")

      .addEventListener("click", (event) => {



        if (

          event.target.id ===

          "successModal"

        ) {

          closeModal();

        }

      });



    /* =========================

       日期格式化

    ========================= */



    function formatDate(value) {



      if (!value) {

        return "请选择";

      }



      const parts =

        String(value).split("-");



      if (parts.length !== 3) {

        return value;

      }



      return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日`;

    }



    /* =========================

       时间格式化

    ========================= */



    function formatTime(value) {



      if (!value) {

        return "";

      }



      const stringValue =

        String(value);



      if (

        stringValue.length >= 5 &&

        /^\d{2}:\d{2}/.test(stringValue)

      ) {

        return stringValue.slice(0, 5);

      }



      return stringValue;

    }



    /* =========================

       HTML 安全处理

    ========================= */



    function escapeHtml(value) {



      return String(value ?? "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }



  </script>
